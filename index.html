<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071a33">

<title>M.Awaji Livescores</title>

<style>
:root{
  --navy:#071a33;
  --navy2:#0d2b52;
  --blue:#1261a0;
  --green:#16a34a;
  --red:#dc2626;
  --orange:#f59e0b;
  --bg:#f4f6f9;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --border:#e1e5eb;
  --shadow:0 5px 18px rgba(0,0,0,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#07111f;
  --card:#0d1b2d;
  --text:#f3f6fa;
  --muted:#9ca9b8;
  --border:#22334a;
  --shadow:0 5px 18px rgba(0,0,0,.3);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;
  padding:18px 16px 14px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:white;
  color:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
}

.brand-name{
  font-size:22px;
  font-weight:800;
}

.tagline{
  font-size:10px;
  opacity:.8;
  letter-spacing:1.5px;
  margin-top:3px;
}

.live-head{
  display:flex;
  align-items:center;
  gap:7px;
  font-size:12px;
  font-weight:bold;
}

.live-dot{
  width:9px;
  height:9px;
  background:#ef4444;
  border-radius:50%;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

/* NAV */
nav{
  background:var(--card);
  border-bottom:1px solid var(--border);
  position:sticky;
  top:81px;
  z-index:900;
  overflow-x:auto;
}

.nav-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  min-width:max-content;
}

.nav-btn{
  border:0;
  background:none;
  padding:14px 16px;
  color:var(--muted);
  font-weight:700;
  cursor:pointer;
  font-size:14px;
  border-bottom:3px solid transparent;
}

.nav-btn.active{
  color:var(--blue);
  border-bottom-color:var(--blue);
}

.nav-btn:hover{
  color:var(--blue);
}

/* MAIN */
main{
  max-width:1100px;
  margin:auto;
  padding:18px 12px 40px;
}

/* TOOLBAR */
.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}

.search{
  flex:1 1 240px;
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.select,
.toolbar button{
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
}

.toolbar button:hover{
  border-color:var(--blue);
}

/* DATE BAR */
.date-bar{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  overflow-x:auto;
}

.date-btn{
  flex:1;
  min-width:105px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  padding:12px 8px;
  cursor:pointer;
}

.date-btn strong{
  display:block;
  font-size:14px;
}

.date-btn small{
  color:var(--muted);
}

.date-btn.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

.date-btn.active small{
  color:#d5e1ef;
}

/* STATUS */
.page-status{
  margin:8px 0 14px;
  color:var(--muted);
  font-size:13px;
}

/* LOADING */
.loading,
.error,
.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid var(--border);
  border-top-color:var(--blue);
  border-radius:50%;
  animation:spin .8s linear infinite;
  margin:0 auto 12px;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  color:var(--red);
}

/* LEAGUE */
.league{
  margin-bottom:16px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.league-title{
  padding:12px 14px;
  background:rgba(18,97,160,.07);
  border-bottom:1px solid var(--border);
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.league-title span{
  color:var(--muted);
  font-size:12px;
}

/* MATCH */
.match{
  padding:13px 14px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:.18s;
}

.match:last-child{
  border-bottom:0;
}

.match:hover{
  background:rgba(18,97,160,.04);
}

.match-main{
  display:grid;
  grid-template-columns:1fr 80px 1fr;
  align-items:center;
  gap:10px;
}

.team{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-name{
  font-size:14px;
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.team-logo{
  width:30px;
  height:30px;
  object-fit:contain;
  flex:none;
}

.score{
  text-align:center;
  font-weight:900;
  font-size:17px;
}

.score-time{
  font-size:11px;
  color:var(--muted);
  margin-top:4px;
}

.live-label{
  display:inline-block;
  background:#dc2626;
  color:white;
  border-radius:5px;
  padding:2px 5px;
  font-size:9px;
  margin-top:3px;
  animation:pulse 1.2s infinite;
}

.finished{
  color:var(--muted);
  font-size:11px;
}

.favorite{
  float:right;
  border:0;
  background:none;
  cursor:pointer;
  font-size:20px;
  color:#c2c8d0;
}

.favorite.active{
  color:#f59e0b;
}

/* LEAGUES HUB */
.leagues-page{
  display:block;
}

.leagues-header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:18px;
}

.leagues-header h1{
  margin:0 0 7px;
  font-size:25px;
}

.leagues-header p{
  margin:0;
  opacity:.82;
  font-size:14px;
}

.league-search{
  width:100%;
  padding:13px 15px;
  margin:16px 0;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.country-list{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:18px;
}

.country-btn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:20px;
  padding:9px 14px;
  white-space:nowrap;
  cursor:pointer;
  font-weight:700;
}

.country-btn.active{
  background:var(--navy);
  color:white;
  border-color:var(--navy);
}

.country-section{
  margin-bottom:22px;
}

.country-title{
  font-size:19px;
  margin:0 0 10px;
}

.league-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
  gap:10px;
}

.league-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  cursor:pointer;
  transition:.18s;
  box-shadow:var(--shadow);
}

.league-card:hover{
  transform:translateY(-2px);
  border-color:var(--blue);
}

.league-card-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.league-icon{
  width:42px;
  height:42px;
  border-radius:10px;
  background:rgba(18,97,160,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.league-card h3{
  margin:0;
  font-size:14px;
}

.league-card p{
  margin:4px 0 0;
  color:var(--muted);
  font-size:11px;
}

.back-leagues{
  border:0;
  background:var(--navy);
  color:white;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:700;
  margin-bottom:14px;
}

/* DETAILS */
.match-details{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.back-button{
  margin:14px;
  border:0;
  background:var(--navy);
  color:white;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
}

.details-header{
  text-align:center;
  padding:10px 18px 22px;
}

.details-league{
  font-size:16px;
  font-weight:800;
}

.details-country{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.details-status{
  margin:12px auto;
  display:inline-block;
  background:#eef2f7;
  color:#4b5563;
  border-radius:20px;
  padding:6px 12px;
  font-size:12px;
  font-weight:800;
}

.details-status.live{
  background:#dc2626;
  color:white;
}

.details-teams{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
  gap:15px;
  max-width:700px;
  margin:auto;
}

.details-team{
  text-align:center;
}

.details-team img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.details-team h2{
  font-size:16px;
  margin:8px 0 0;
}

.details-score{
  font-size:30px;
  font-weight:900;
}

.details-vs{
  color:var(--muted);
  font-size:12px;
}

.details-info{
  border-top:1px solid var(--border);
  padding:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:10px;
}

.info-box{
  background:rgba(18,97,160,.05);
  border-radius:10px;
  padding:11px;
  font-size:12px;
}

.info-box strong{
  display:block;
  margin-bottom:4px;
}

.details-section{
  border-top:1px solid var(--border);
  padding:17px;
}

.details-section-title{
  font-size:16px;
  font-weight:800;
  margin-bottom:12px;
}

.event-row{
  display:grid;
  grid-template-columns:1fr 60px 1fr;
  gap:10px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

.event-home{
  text-align:right;
}

.event-away{
  text-align:left;
}

.event-time{
  text-align:center;
  font-weight:800;
}

.stat-row{
  margin-bottom:12px;
}

.stat-names{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  margin-bottom:5px;
}

.stat-values{
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.lineup-card{
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:8px;
  font-size:12px;
}

.no-data{
  color:var(--muted);
  font-size:13px;
}

/* STANDINGS */
.standings-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:auto;
  box-shadow:var(--shadow);
}

.standings-controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:14px;
}

.standings-table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

.standings-table th,
.standings-table td{
  padding:10px 8px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:12px;
}

.standings-table th{
  background:rgba(18,97,160,.07);
}

.standings-table td:nth-child(2){
  text-align:left;
  font-weight:700;
}

.position{
  font-weight:900;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px 15px;
  color:var(--muted);
  font-size:12px;
}

/* MOBILE */
@media(max-width:650px){

  header{
    padding:14px 12px;
  }

  .logo{
    width:42px;
    height:42px;
    font-size:24px;
  }

  .brand-name{
    font-size:18px;
  }

  .tagline{
    font-size:8px;
  }

  .live-head{
    font-size:10px;
  }

  nav{
    top:70px;
  }

  .nav-btn{
    padding:12px 11px;
    font-size:12px;
  }

  main{
    padding:14px 8px 30px;
  }

  .match-main{
    grid-template-columns:1fr 65px 1fr;
  }

  .team-name{
    font-size:12px;
  }

  .team-logo{
    width:26px;
    height:26px;
  }

  .score{
    font-size:15px;
  }

  .details-teams{
    grid-template-columns:1fr 75px 1fr;
    gap:7px;
  }

  .details-team img{
    width:55px;
    height:55px;
  }

  .details-team h2{
    font-size:13px;
  }

  .details-score{
    font-size:25px;
  }

  .league-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:400px){
  .league-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<header>

      <div class="logo">M</div>

</header>

    <!-- NEW LEAGUES TAB -->
    <button class="nav-btn" id="nav-leagues"

      🌍 Leagues

  </div>
</nav>

<main>

  <!-- NORMAL CONTROLS -->
  <div id="normalControls">

    <div class="toolbar">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search team or league..."

      >

      <select
        id="leagueFilter"

        onchange="applyFilters()">
        <option value="all">All leagues</option>
      </select>

      <select
        id="statusFilter"
        class="select"
        onchange="applyFilters()">
        <option value="all">All matches</option>
        <option value="live">Live</option>
        <option value="upcoming">Upcoming</option>
        <option value="finished">Finished</option>
      </select>

      <button onclick="manualRefresh()">↻ Refresh</button>

      <button onclick="toggleDarkMode()">🌙</button>

    </div>

    <div id="dateBar" class="date-bar"></div>

  </div>

  <!-- CONTENT -->
  <div id="content"></div>

</main>

<footer>
  © <span id="year"></span> M.Awaji Livescores
  <br>
  Real football scores • Fixtures • Results • Standings
</footer>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function getMatches(data){
  if(Array.isArray(data)) return data;

  if(Array.isArray(data?.response))
    return data.response;

  if(Array.isArray(data?.data))
    return data.data;

  return [];
}

function getTeam(match, side){
  return match?.teams?.[side] ||
         match?.fixture?.teams?.[side] ||
         {};
}

function getScore(match, side){
  const score =
    match?.goals?.[side] ??
    match?.score?.fulltime?.[side] ??
    match?.score?.[side];

  return score === null || score === undefined
    ? "-"
    : score;
}

function getStatus(match){

  return match?.fixture?.status ||
         match?.status ||
         {};
}

function getMatchId(match){
  return Number(
    match?.fixture?.id ??
    match?.id ??
    match?.fixture_id ??
    0
  );
}

function getLeague(match){

  return match?.league ||
         match?.fixture?.league ||
         {};
}

function getLeagueId(match){
  return Number(
    getLeague(match)?.id ??
    match?.league_id ??
    0
  );
}

function isLive(match){

  const s = getStatus(match);

  const code =
    String(s.short || s.code || "").toUpperCase();

  return [
    "1H","HT","2H","ET","BT",
    "P","LIVE","INT","2H"
  ].includes(code);
}

function isFinished(match){

  const s = getStatus(match);

  const code =
    String(s.short || s.code || "").toUpperCase();

  return [
    "FT","AET","PEN",
    "AWD","WO"
  ].includes(code);
}

function statusText(match){

  const s = getStatus(match);

  if(isLive(match)){
    if(s.elapsed !== undefined &&
       s.elapsed !== null){
      return `${s.elapsed}'`;
    }

    return "LIVE";
  }

  if(isFinished(match))
    return "FT";

  return s.long || s.short || "Scheduled";
}

function teamLogo(team){

  return team?.logo ||
         "https://media.api-sports.io/football/teams/0.png";
}

function formatDate(date){

  const d = new Date(date + "T12:00:00");

  return d.toLocaleDateString(
    undefined,
    {
      weekday:"short",
      month:"short",
      day:"numeric"
    }
  );
}

function todayDate(){

  return new Date()
    .toISOString()
    .slice(0,10);
}

function changeDate(days){

  const d = new Date(selectedDate + "T12:00:00");

  d.setDate(d.getDate() + days);

  selectedDate =
    d.toISOString().slice(0,10);

  renderDateBar();

  if(currentPage === "fixtures"){
    loadFixtures();
  }

  else if(currentPage === "results"){
    loadResults();
  }

  else if(currentPage === "live"){
    loadLive();
  }

  else if(selectedLeagueId){
    loadLeagueMatches();
  }
}


/* =========================================================
   API
========================================================= */

async function fetchAPI(action, extra = ""){

  const url =
    `${API_BASE}?action=${action}${extra}`;

  const response =
    await fetch(url, {
      cache:"no-store"
    });

  let data;

  try{
    data = await response.json();
  }catch(e){
    throw new Error("Invalid API response");
  }

  if(!response.ok){

    throw new Error(
      data?.error ||
      "API request failed"
    );
  }

  return data;
}

/* =========================================================
   DATE BAR
========================================================= */

function renderDateBar(){

  const bar =
    document.getElementById("dateBar");

  const base =
    new Date(selectedDate + "T12:00:00");

  const dates = [];

  for(let i=-1;i<=1;i++){

    const d =
      new Date(base);

    d.setDate(
      base.getDate() + i
    );

    dates.push(
      d.toISOString().slice(0,10)
    );
  }

  bar.innerHTML =
    dates.map(date => {

      let label;

      if(date === todayDate())
        label = "Today";

      else{

        const diff =
          Math.round(
            (
              new Date(date+"T12:00:00") -
              new Date(todayDate()+"T12:00:00")
            ) / 86400000
          );

        label =
          diff === -1
            ? "Yesterday"
            : "Tomorrow";
      }

      return `
        <button
          class="date-btn ${date===selectedDate?"active":""}"
          onclick="selectDate('${date}')"
        >
          <strong>${label}</strong>
          <small>${formatDate(date)}</small>
        </button>
      `;

    }).join("");
}

function selectDate(date){

  selectedDate = date;

  renderDateBar();

  if(currentPage === "fixtures")
    loadFixtures();

  else if(currentPage === "results")
    loadResults();

  else if(currentPage === "live")
    loadLive();

  else if(selectedLeagueId)
    loadLeagueMatches();
}


/* =========================================================
   MATCH FILTERING
========================================================= */

function populateLeagueFilter(matches){

  const select =
    document.getElementById("leagueFilter");

  const existing =
    select.value;

  const leagues = {};

  matches.forEach(match => {

    const league =
      getLeague(match);

    if(league.id)
      leagues[league.id] =
        league.name || `League ${league.id}`;

  });

  select.innerHTML =
    `<option value="all">All leagues</option>` +
    Object.entries(leagues)
      .sort((a,b)=>a[1].localeCompare(b[1]))
      .map(([id,name]) =>
        `<option value="${id}">
          ${escapeHTML(name)}
        </option>`
      ).join("");

  if(
    [...select.options]
      .some(o=>o.value===existing)
  )
    select.value = existing;
}

function applyFilters(){

  if(!allCurrentMatches.length){

    renderMatches([]);

    return;
  }

  const search =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const league =
    document
      .getElementById("leagueFilter")
      .value;

  const status =
    document
      .getElementById("statusFilter")
      .value;

  let matches =
    allCurrentMatches.filter(match => {

      const home =
        getTeam(match,"home");

      const away =
        getTeam(match,"away");

      const lg =
        getLeague(match);

      const text =
        `${home.name||""} ${away.name||""} ${lg.name||""}`
          .toLowerCase();

      if(search && !text.includes(search))
        return false;

      if(
        league !== "all" &&
        String(getLeagueId(match)) !== String(league)
      )
        return false;

      if(status === "live" && !isLive(match))
        return false;

      if(status === "finished" && !isFinished(match))
        return false;

      if(status === "upcoming" &&
         (isLive(match) || isFinished(match)))
        return false;

      return true;
    });

  renderMatches(matches);
}

function setStatusFilter(value){

  document.getElementById("statusFilter").value =
    value;

  applyFilters();
}


/* =========================================================
   MATCH CARD
========================================================= */

function matchCard(match){

  const home =
    getTeam(match,"home");

  const away =
    getTeam(match,"away");

  const id =
    getMatchId(match);

  const homeScore =
    getScore(match,"home");

  const awayScore =
    getScore(match,"away");

  const live =
    isLive(match);

  const finished =
    isFinished(match);

  const favorite =
    favoriteMatches.includes(id);

  return `
    <div
      class="match"
      onclick="openMatchDetails(${id})"
      title="View match details"
    >

      <button
        class="favorite ${favorite?"active":""}"
        onclick="event.stopPropagation(); toggleFavorite(${id})"
      >
        ${favorite?"★":"☆"}
      </button>

      <div class="match-main">

        <div class="team">
          <img
            class="team-logo"
            src="${escapeHTML(teamLogo(home))}"
            alt=""
            onerror="this.style.display='none'"
          >
          <div class="team-name">
            ${escapeHTML(home.name || "Home")}
          </div>
        </div>

        <div class="score">

          <div>
            ${homeScore}
            -
            ${awayScore}
          </div>

          <div class="score-time">

            ${
              live
                ? `<span class="live-label">
                     ${escapeHTML(statusText(match))}
                   </span>`
                : finished
                  ? `<span class="finished">FT</span>`
                  : escapeHTML(statusText(match))
            }

          </div>

        </div>

        <div class="team away">

          <div class="team-name">
            ${escapeHTML(away.name || "Away")}
          </div>

          <img
            class="team-logo"
            src="${escapeHTML(teamLogo(away))}"
            alt=""
            onerror="this.style.display='none'"
          >

        </div>

      </div>

    </div>
  `;
}


/* =========================================================
   RENDER MATCHES
========================================================= */

function renderMatches(matches){

  currentMatches = matches;

  const content =
    document.getElementById("content");

  if(!matches.length){

    content.innerHTML = `
      <div class="empty">
        ⚽<br><br>
        No matches found.
      </div>
    `;

    return;
  }

  const grouped = {};

  matches.forEach(match => {

    const league =
      getLeague(match);

    const key =
      league.id ||
      league.name ||
      "other";

    if(!grouped[key])
      grouped[key] = {
        name:league.name || "Football",
        country:league.country || "",
        matches:[]
      };

    grouped[key].matches.push(match);
  });

  content.innerHTML =
    Object.values(grouped)
      .map(group => `

        <div class="league">

          <div class="league-title">

            <div>
              ⚽ ${escapeHTML(group.name)}
            </div>

            <span>
              ${escapeHTML(group.country || "")}
            </span>

          </div>

          ${group.matches
            .map(matchCard)
            .join("")}

        </div>

      `).join("");
}

========================================================= */

function toggleFavorite(id){

  id = Number(id);

  if(!id)
    return;

  if(favoriteMatches.includes(id)){

    favoriteMatches =
      favoriteMatches.filter(
        item => item !== id
      );

  }else{

    favoriteMatches.push(id);
  }

  localStorage.setItem(
    "mAwajiFavorites",
    JSON.stringify(favoriteMatches)
  );

  if(currentPage === "favorites")
    loadFavorites();
  else
    applyFilters();
}

async function loadFavorites(){

  document.getElementById("content").innerHTML =
    `<div class="loading">
      <div class="spinner"></div>
      Loading favorite matches...
    </div>`;

  if(!favoriteMatches.length){

    document.getElementById("content").innerHTML =
      `<div class="empty">
        ⭐<br><br>
        You have no favorite matches yet.<br>
        Tap ☆ beside a match to add it.
      </div>`;

    return;
  }

  try{

    const data =
      await fetchAPI(
        "fixtures",
        `&date=${encodeURIComponent(selectedDate)}`
      );

    const matches =
      getMatches(data);

    const favorites =
      matches.filter(match =>
        favoriteMatches.includes(
          getMatchId(match)
        )
      );

    allCurrentMatches = favorites;

    populateLeagueFilter(favorites);

    renderMatches(favorites);

  }catch(error){

    document.getElementById("content").innerHTML =
      `<div class="error">
        ⚠️ ${escapeHTML(error.message)}
      </div>`;
  }
}

   LEAGUE MATCHES
========================================================= */

async function loadLeagueMatches(){

  if(!selectedLeagueId)
    return;

  const container =
    document.getElementById("leagueMatches");

  if(!container)
    return;

  container.innerHTML =
    `<div class="loading">
      <div class="spinner"></div>
      Loading real ${escapeHTML(selectedLeagueName)}
      matches...
    </div>`;

  try{

    let matches = [];

    /*
      For today's live matches use the live endpoint.
      For another date use fixtures.
    */

    if(
      selectedDate === todayDate()
    ){

      const liveData =
        await fetchAPI("live");

      const liveMatches =
        getMatches(liveData)
          .filter(
            match =>
              getLeagueId(match) ===
              Number(selectedLeagueId)
          );

      matches = liveMatches;

    }

    const fixtureData =
      await fetchAPI(
        "fixtures",
        `&date=${encodeURIComponent(selectedDate)}`
      );

    const fixtureMatches =
      getMatches(fixtureData)
        .filter(
          match =>
            getLeagueId(match) ===
            Number(selectedLeagueId)
        );

    /*
      Combine live + scheduled matches
      without duplicates.
    */

    const map = new Map();

    [...fixtureMatches, ...matches]
      .forEach(match => {

        const id =
          getMatchId(match);

        if(id)
          map.set(id,match);

      });

    matches =
      [...map.values()];

    allCurrentMatches =
      matches;

    if(!matches.length){

      container.innerHTML = `
        <div class="empty">

          ⚽<br><br>

          No ${escapeHTML(selectedLeagueName)}
          matches found for
          <strong>${formatDate(selectedDate)}</strong>.

          <br><br>

          Try another date.

        </div>
      `;

      return;
    }

    container.innerHTML = `

      <div class="league">

        <div class="league-title">

          <div>
            ⚽ ${escapeHTML(selectedLeagueName)}
          </div>

          <span>
            ${formatDate(selectedDate)}
          </span>

        </div>

        ${matches
          .map(matchCard)
          .join("")}

      </div>
    `;

  }catch(error){

    container.innerHTML =
      `<div class="error">
        ⚠️ ${escapeHTML(error.message)}
      </div>`;
  }
}


/* =========================================================
   MATCH DETAILS
========================================================= */

async function openMatchDetails(matchId){

  if(!matchId)
    return;

  document
    .getElementById("normalControls")
    .style.display = "none";

  document.getElementById("content").innerHTML =
    `<div class="loading">
      <div class="spinner"></div>
      Loading match details...
    </div>`;

  try{

    const data =
      await fetchAPI(
        "match",
        `&id=${encodeURIComponent(matchId)}`
      );

    let match =
      data?.response?.[0] ||
      data?.data?.[0] ||
      data?.response ||
      data?.data ||
      data;

    if(Array.isArray(match))
      match = match[0];

    if(!match)
      throw new Error("Match details not found");

    renderMatchDetails(match);

  }catch(error){

    document.getElementById("content").innerHTML =
      `
      <button
        class="back-button"
        onclick="goBackFromDetails()"
      >
        ← Back
      </button>

      <div class="error">
        ⚠️ ${escapeHTML(error.message)}
      </div>
      `;
  }
}

function goBackFromDetails(){

  if(selectedLeagueId){

    openLeague(
      selectedLeagueId,
      selectedLeagueName,
      selectedCountry,
      ""
    );

    return;
  }

  document
    .getElementById("normalControls")
    .style.display = "block";

  showPage(currentPage);
}

function renderMatchDetails(match){

  const fixture =
    match.fixture || {};

  const league =
    match.league || {};

  const home =
    getTeam(match,"home");

  const away =
    getTeam(match,"away");

  const homeScore =
    getScore(match,"home");

  const awayScore =
    getScore(match,"away");

  const live =
    isLive(match);

  const date =
    fixture.date
      ? new Date(fixture.date)
          .toLocaleString()
      : "N/A";

  const venue =
    fixture.venue?.name ||
    "Venue not available";

  const city =
    fixture.venue?.city || "";

  document.getElementById("content").innerHTML = `

    <div class="match-details">

      <button
        class="back-button"
        onclick="goBackFromDetails()"
      >
        ← Back
      </button>

      <div class="details-header">

        <div class="details-league">
          ${escapeHTML(league.name || "Football")}
        </div>

        <div class="details-country">
          ${escapeHTML(league.country || "")}
        </div>

        <div
          class="details-status ${live?"live":""}"
        >
          ${escapeHTML(statusText(match))}
        </div>

        <div class="details-teams">

          <div class="details-team">

            <img
              src="${escapeHTML(teamLogo(home))}"
              alt=""
              onerror="this.style.display='none'"
            >

            <h2>
              ${escapeHTML(home.name || "Home")}
            </h2>

          </div>

          <div>

            <div class="details-score">
              ${homeScore} - ${awayScore}
            </div>

            ${
              live
              ? ""
              : `<div class="details-vs">VS</div>`
            }

          </div>

          <div class="details-team">

            <img
              src="${escapeHTML(teamLogo(away))}"
              alt=""
              onerror="this.style.display='none'"
            >

            <h2>
              ${escapeHTML(away.name || "Away")}
            </h2>

          </div>

        </div>

      </div>

      <div class="details-info">

        <div class="info-box">
          <strong>📅 Date</strong>
          ${escapeHTML(date)}
        </div>

        <div class="info-box">
          <strong>🏟️ Venue</strong>
          ${escapeHTML(venue)}
          ${city ? `<br>${escapeHTML(city)}` : ""}
        </div>

        <div class="info-box">
          <strong>🏆 Competition</strong>
          ${escapeHTML(league.name || "Football")}
        </div>

      </div>

      <div id="eventsSection"></div>

      <div id="statisticsSection"></div>

      <div id="lineupsSection"></div>

    </div>
  `;

  renderEvents(match);

  renderStatistics(match);

  renderLineups(match);
}


/* =========================================================
   EVENTS
========================================================= */

function renderEvents(match){

  const container =
    document.getElementById("eventsSection");

  const events =
    match.events || [];

  if(!events.length){

    container.innerHTML = `
      <div class="details-section">

        <div class="details-section-title">
          ⚡ Match Events
        </div>

        <div class="no-data">
          No event information available.
        </div>

      </div>
    `;

    return;
  }

  const home =
    getTeam(match,"home");

  container.innerHTML = `
    <div class="details-section">

      <div class="details-section-title">
        ⚡ Match Events
      </div>

      ${events.map(event => {

        const minute =
          event.time?.elapsed ??
          event.time ??
          "";

        const player =
          event.player?.name ||
          event.player ||
          "";

        const assist =
          event.assist?.name || "";

        const detail =
          event.detail ||
          event.type ||
          "";

        const teamId =
          event.team?.id;

        const homeId =
          home.id;

        const text =
          `${detail}${player ? " • "+player : ""}${assist ? " • "+assist : ""}`;

        return `

          <div class="event-row">

            <div class="event-home">

              ${
                String(teamId) === String(homeId)
                  ? escapeHTML(text)
                  : ""
              }

            </div>

            <div class="event-time">
              ${escapeHTML(minute)}'
            </div>

            <div class="event-away">

              ${
                String(teamId) !== String(homeId)
                  ? escapeHTML(text)
                  : ""
              }

            </div>

          </div>

        `;

      }).join("")}

    </div>
  `;
}


/* =========================================================
   STATISTICS
========================================================= */

function renderStatistics(match){

  const container =
    document.getElementById("statisticsSection");

  const statistics =
    match.statistics || [];

  if(!statistics.length){

    container.innerHTML = `
      <div class="details-section">

        <div class="details-section-title">
          📊 Statistics
        </div>

        <div class="no-data">
          Statistics are not available for this match.
        </div>

      </div>
    `;

    return;
  }

  const homeStats =
    statistics[0]?.statistics || [];

  const awayStats =
    statistics[1]?.statistics || [];

  const stats = {};

  homeStats.forEach(item => {

    stats[item.type] = {
      home:item.value,
      away:"-"
    };

  });

  awayStats.forEach(item => {

    if(!stats[item.type])
      stats[item.type] = {
        home:"-",
        away:item.value
      };
    else
      stats[item.type].away = item.value;

  });

  container.innerHTML = `
    <div class="details-section">

      <div class="details-section-title">
        📊 Statistics
      </div>

      ${Object.entries(stats)
        .map(([name,value]) => `

          <div class="stat-row">

            <div class="stat-names">
              <span>
                ${escapeHTML(name)}
              </span>
            </div>

            <div class="stat-values">

              <span>
                ${escapeHTML(value.home ?? "-")}
              </span>

              <span>
                ${escapeHTML(value.away ?? "-")}
              </span>

            </div>

          </div>

        `).join("")}

    </div>
  `;
}


/* =========================================================
   LINEUPS
========================================================= */

function renderLineups(match){

  const container =
    document.getElementById("lineupsSection");

  const lineups =
    match.lineups || [];

  if(!lineups.length){

    container.innerHTML = `
      <div class="details-section">

        <div class="details-section-title">
          👥 Lineups
        </div>

        <div class="no-data">
          Lineups are not available for this match.
        </div>

      </div>
    `;

    return;
  }

  container.innerHTML = `
    <div class="details-section">

      <div class="details-section-title">
        👥 Lineups
      </div>

      ${lineups.map(team => `

        <div class="lineup-card">

          <strong>
            ${escapeHTML(team.team?.name || "Team")}
          </strong>

          <br><br>

          ${
            (team.startXI || [])
              .map(player => {

                const name =
                  player.player?.name ||
                  player.name ||
                  "";

                return escapeHTML(name);

              })
              .join(", ") ||
            "Starting lineup unavailable"
          }

        </div>

      `).join("")}

    </div>
  `;
}

async function loadStandings(){

  const league =
    document.getElementById(
      "standingLeague"
    ).value;

  const season =
    document.getElementById(
      "standingSeason"
    ).value;

  document.getElementById(
    "standingsContent"
  ).innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      Loading standings...
    </div>
  `;

  try{

    const data =
      await fetchAPI(
        "standings",
        `&league=${encodeURIComponent(league)}&season=${encodeURIComponent(season)}`
      );

    const response =
      data?.response || [];

    if(!response.length){

      document.getElementById(
        "standingsContent"
      ).innerHTML =
        `<div class="empty">
          No standings available.
        </div>`;

      return;
    }

    const leagueData =
      response[0]?.league || response[0];

    const groups =
      leagueData?.standings || [];

    const table =
      groups[0] || [];

    document.getElementById(
      "standingsContent"
    ).innerHTML = `

      <div class="standings-wrap">

        <table class="standings-table">

          <thead>
            <tr>
              <th>#</th>
              <th>Team</th>
              <th>P</th>
              <th>W</th>
              <th>D</th>
              <th>L</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
              <th>Pts</th>
            </tr>
          </thead>

          <tbody>

            ${table.map(row => {

              const team =
                row.team || {};

              return `
                <tr>

                  <td class="position">
                    ${row.rank ?? "-"}
                  </td>

                  <td>
                    ${escapeHTML(team.name || "")}
                  </td>

                  <td>${row.all?.played ?? 0}</td>

                  <td>${row.all?.win ?? 0}</td>

                  <td>${row.all?.draw ?? 0}</td>

                  <td>${row.all?.lose ?? 0}</td>

                  <td>${row.all?.goals?.for ?? 0}</td>

                  <td>${row.all?.goals?.against ?? 0}</td>

                  <td>${row.goalsDiff ?? 0}</td>

                  <td>
                    <strong>
                      ${row.points ?? 0}
                    </strong>
                  </td>

                </tr>
              `;

            }).join("")}

          </tbody>

        </table>

      </div>
    `;

  }catch(error){

    document.getElementById(
      "standingsContent"
    ).innerHTML =
      `<div class="error">
        ⚠️ ${escapeHTML(error.message)}
      </div>`;
  }
}


/* =========================================================
   DARK MODE
========================================================= */

function toggleDarkMode(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "mAwajiDarkMode",
    document.body.classList.contains("dark")
      ? "1"
      : "0"
  );
}

function loadDarkMode(){

  if(
    localStorage.getItem(
      "mAwajiDarkMode"
    ) === "1"
  ){

    document.body.classList.add("dark");
  }
}


/* =========================================================
   MANUAL REFRESH
========================================================= */

function manualRefresh(){

  if(currentPage === "live")
    loadLive();

  else if(currentPage === "fixtures")
    loadFixtures();

  else if(currentPage === "results")
    loadResults();

  else if(currentPage === "favorites")
    loadFavorites();

  else if(currentPage === "standings")
    loadStandings();

  else if(selectedLeagueId)
    loadLeagueMatches();

  else if(currentPage === "leagues")
    renderLeaguesHub();
}


/* =========================================================
   SHARE
========================================================= */

async function shareMatch(){

  if(!navigator.share){

    alert(
      "Sharing is not supported on this device."
    );

    return;
  }

  try{

    await navigator.share({
      title:"M.Awaji Livescores",
      text:"Check this football match on M.Awaji Livescores",
      url:location.href
    });

  }catch(e){
    /* user cancelled */
  }
}


/* =========================================================
   BROWSER NOTIFICATIONS
========================================================= */

async function enableNotifications(){

  if(!("Notification" in window)){

    alert(
      "Notifications are not supported by this browser."
    );

    return;
  }

  const permission =
    await Notification.requestPermission();

  if(permission === "granted"){

    new Notification(
      "M.Awaji Livescores",
      {
        body:"Notifications are now enabled."
      }
    );

  }
}

setInterval(() => {

  if(currentPage === "live"){

    loadLive();

  else if(selectedLeagueId){

    loadLeagueMatches();

  }

},30000);
