<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.awajilivescores - Live Football Scores</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f6f9;
  color: #071a33;
}

header {
  background: #071a33;
  color: white;
  padding: 30px 20px 28px;
}

.header-inner {
  max-width: 900px;
  margin: auto;
}

.brand {
  display: flex;
  align-items: center;
  gap: 20px;
}

.logo {
  width: 85px;
  height: 85px;
  background: white;
  color: #071a33;
  border-radius: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  font-weight: 900;
}

.brand h1 {
  margin: 0;
  font-size: 30px;
}

.brand p {
  margin: 8px 0 0;
  letter-spacing: 3px;
  font-size: 14px;
  color: #cbd3df;
}

.live-label {
  margin-top: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 19px;
  font-weight: 800;
}

.live-dot {
  width: 15px;
  height: 15px;
  background: #20d56b;
  border-radius: 50%;
  box-shadow: 0 0 0 8px rgba(32,213,107,.12);
}

nav {
  background: white;
  border-bottom: 1px solid #ddd;
  padding: 18px;
}

.nav-inner {
  max-width: 900px;
  margin: auto;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.nav-btn {
  border: 0;
  background: #edf1f6;
  color: #4c5665;
  padding: 16px 8px;
  border-radius: 15px;
  font-size: 18px;
  font-weight: 800;
  cursor: pointer;
}

.nav-btn.active {
  background: #071a33;
  color: white;
}

main {
  max-width: 900px;
  margin: auto;
  padding: 22px 18px 60px;
}

.date-bar {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 20px;
}

.date-btn {
  background: white;
  border: 1px solid #e0e3e8;
  border-radius: 15px;
  padding: 16px 8px;
  text-align: center;
  font-size: 17px;
  font-weight: 800;
  color: #626b78;
  cursor: pointer;
}

.date-btn.active {
  border: 1px solid #071a33;
  background: #edf2f8;
  color: #071a33;
}

.date-btn small {
  display: block;
  margin-top: 5px;
  font-size: 14px;
  color: #7b8490;
}

.action-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-bottom: 28px;
}

.action-btn {
  border: 1px solid #e0e3e8;
  border-radius: 15px;
  background: white;
  padding: 18px 10px;
  font-size: 17px;
  font-weight: 800;
  color: #071a33;
  cursor: pointer;
}

.action-btn.primary {
  background: #071a33;
  color: white;
}

.section-title {
  font-size: 24px;
  font-weight: 900;
  margin: 0 0 18px;
}

.league {
  background: white;
  border: 1px solid #e1e4e9;
  border-radius: 18px;
  overflow: hidden;
  margin-bottom: 22px;
}

.league-header {
  background: #edf1f6;
  padding: 17px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 900;
  font-size: 18px;
}

.league-country {
  color: #858d99;
  font-size: 14px;
  font-weight: 500;
}

.match {
  display: grid;
  grid-template-columns: 1fr 90px 1fr;
  align-items: center;
  gap: 8px;
  padding: 22px 18px;
  border-top: 1px solid #edf0f3;
}

.team {
  font-size: 17px;
  font-weight: 800;
}

.team.home {
  text-align: right;
}

.team.away {
  text-align: left;
}

.score {
  text-align: center;
  font-size: 22px;
  font-weight: 900;
  color: #071a33;
}

.status {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  color: #7b8490;
  font-weight: 700;
}

.status.live {
  color: #e21d35;
}

.loading,
.empty,
.error {
  background: white;
  border-radius: 18px;
  padding: 45px 20px;
  text-align: center;
  font-size: 18px;
  font-weight: 700;
}

.error {
  background: #fff5f5;
  color: #b33b3b;
}

.standings-box {
  background: white;
  border: 1px solid #e1e4e9;
  border-radius: 18px;
  padding: 22px;
  margin-bottom: 22px;
}

.standings-box h2 {
  margin: 0;
  font-size: 23px;
}

.league-select {
  width: 100%;
  padding: 15px;
  margin-top: 18px;
  border: 1px solid #dce1e7;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 700;
  background: white;
  color: #071a33;
}

.show-standings {
  width: 100%;
  margin-top: 12px;
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #071a33;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.table-wrap {
  background: white;
  border: 1px solid #e1e4e9;
  border-radius: 18px;
  overflow-x: auto;
}

.standings-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 570px;
}

.standings-table th {
  background: #edf1f6;
  padding: 13px 8px;
  font-size: 12px;
  text-align: center;
}

.standings-table th:nth-child(2) {
  text-align: left;
}

.standings-table td {
  padding: 14px 8px;
  border-top: 1px solid #edf0f3;
  text-align: center;
  font-size: 13px;
  font-weight: 700;
}

.standings-table td:nth-child(2) {
  text-align: left;
}

.team-name {
  display: flex;
  align-items: center;
  gap: 8px;
}

.team-logo {
  width: 25px;
  height: 25px;
  object-fit: contain;
}

.points {
  font-size: 15px;
  font-weight: 900;
}

footer {
  text-align: center;
  padding: 30px 15px 45px;
  color: #929aa5;
  font-size: 14px;
}

@media(max-width:600px) {

  header {
    padding: 30px 28px;
  }

  .logo {
    width: 70px;
    height: 70px;
    font-size: 40px;
  }

  .brand h1 {
    font-size: 25px;
  }

  .brand p {
    font-size: 11px;
  }

  .match {
    grid-template-columns: 1fr 75px 1fr;
    padding: 20px 10px;
  }

  .team {
    font-size: 15px;
  }

  .score {
    font-size: 19px;
  }

  .league-header {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-inner">

    <div class="brand">

      <div class="logo">M</div>

      <div>
        <h1>M.awajilivescores</h1>
        <p>LIVE FOOTBALL SCORES</p>
      </div>

    </div>

    <div class="live-label">
      <span class="live-dot"></span>
      LIVE FOOTBALL
    </div>

  </div>

</header>


<nav>

  <div class="nav-inner">

    <button
      id="nav-live"
      class="nav-btn active"
      onclick="changePage('live')">
      Live
    </button>

    <button
      id="nav-fixtures"
      class="nav-btn"
      onclick="changePage('fixtures')">
      Fixtures
    </button>

    <button
      id="nav-results"
      class="nav-btn"
      onclick="changePage('results')">
      Results
    </button>

    <button
      id="nav-standings"
      class="nav-btn"
      onclick="changePage('standings')">
      Standings
    </button>

  </div>

</nav>


<main>

  <div class="date-bar">

    <button
      id="date-yesterday"
      class="date-btn"
      onclick="selectDate(-1)">
      Yesterday
      <small id="yesterday-date"></small>
    </button>

    <button
      id="date-today"
      class="date-btn active"
      onclick="selectDate(0)">
      Today
      <small id="today-date"></small>
    </button>

    <button
      id="date-tomorrow"
      class="date-btn"
      onclick="selectDate(1)">
      Tomorrow
      <small id="tomorrow-date"></small>
    </button>

  </div>


  <div class="action-bar">

    <button
      class="action-btn primary"
      onclick="showAllMatches()">
      ⚽ Show All Matches
    </button>

    <button
      class="action-btn"
      onclick="refreshCurrentPage()">
      ↻ Refresh
    </button>

  </div>


  <div id="content"></div>

</main>


<footer>
  M.awajilivescores<br>
  Live football scores and fixtures
</footer>


<script>

/*
====================================================
API CONNECTION
====================================================
*/

const API_BASE =
  "https://football-livescore-backend-new.vercel.app/api";


/*
====================================================
GLOBAL STATE
====================================================
*/

let currentPage = "live";

let selectedDate =
  new Date();


/*
====================================================
API FUNCTION
====================================================
*/

async function fetchAPI(action, extra = "") {

  const url =
    `${API_BASE}?action=${action}${extra}`;

  const response =
    await fetch(url, {
      method: "GET"
    });

  const data =
    await response.json();

  if (!response.ok) {
    throw new Error(
      data?.error ||
      "API request failed"
    );
  }

  return data;
}


/*
====================================================
DATE FUNCTIONS
====================================================
*/

function formatDate(date) {

  const year =
    date.getFullYear();

  const month =
    String(
      date.getMonth() + 1
    ).padStart(2, "0");

  const day =
    String(
      date.getDate()
    ).padStart(2, "0");

  return `${year}-${month}-${day}`;
}


function displayDate(date) {

  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "short"
    }
  );

}


function setupDates() {

  const today =
    new Date();

  const yesterday =
    new Date(today);

  yesterday.setDate(
    today.getDate() - 1
  );

  const tomorrow =
    new Date(today);

  tomorrow.setDate(
    today.getDate() + 1
  );


  document.getElementById(
    "yesterday-date"
  ).textContent =
    displayDate(yesterday);


  document.getElementById(
    "today-date"
  ).textContent =
    displayDate(today);


  document.getElementById(
    "tomorrow-date"
  ).textContent =
    displayDate(tomorrow);

}


/*
====================================================
SELECT DATE
====================================================
*/

function selectDate(offset) {

  const today =
    new Date();

  selectedDate =
    new Date(today);

  selectedDate.setDate(
    today.getDate() + offset
  );


  document
    .querySelectorAll(".date-btn")
    .forEach(button =>
      button.classList.remove("active")
    );


  if (offset === -1) {

    document
      .getElementById("date-yesterday")
      .classList.add("active");

  }

  if (offset === 0) {

    document
      .getElementById("date-today")
      .classList.add("active");

  }

  if (offset === 1) {

    document
      .getElementById("date-tomorrow")
      .classList.add("active");

  }


  if (currentPage === "live") {

    loadLive();

  }

  else if (currentPage === "fixtures") {

    loadFixtures();

  }

  else if (currentPage === "results") {

    loadResults();

  }

  else {

    showStandings();

  }

}


/*
====================================================
NAVIGATION
====================================================
*/

function changePage(page) {

  currentPage =
    page;


  document
    .querySelectorAll(".nav-btn")
    .forEach(button =>
      button.classList.remove("active")
    );


  const selectedNav =
    document.getElementById(
      `nav-${page}`
    );


  if (selectedNav) {
    selectedNav.classList.add("active");
  }


  if (page === "live") {

    loadLive();

  }

  else if (page === "fixtures") {

    loadFixtures();

  }

  else if (page === "results") {

    loadResults();

  }

  else if (page === "standings") {

    showStandings();

  }

}


/*
====================================================
LIVE
====================================================
*/

async function loadLive() {

  showLoading(
    "Loading live matches..."
  );


  try {

    const data =
      await fetchAPI("live");


    if (hasAPIError(data)) {

      showAPIError(data);
      return;

    }


    const matches =
      data.response || [];


    if (!matches.length) {

      showEmpty(
        "There are currently no live matches."
      );

      return;

    }


    displayMatches(
      matches,
      "Live Matches"
    );


  }

  catch (error) {

    showConnectionError(error);

  }

}


/*
====================================================
FIXTURES
====================================================
*/

async function loadFixtures() {

  showLoading(
    "Loading fixtures..."
  );


  try {

    const date =
      formatDate(selectedDate);


    const data =
      await fetchAPI(
        "fixtures",
        `&date=${date}`
      );


    if (hasAPIError(data)) {

      showAPIError(data);
      return;

    }


    const matches =
      data.response || [];


    if (!matches.length) {

      showEmpty(
        "No fixtures found for this date."
      );

      return;

    }


    displayMatches(
      matches,
      "Fixtures"
    );


  }

  catch (error) {

    showConnectionError(error);

  }

}


/*
====================================================
RESULTS
====================================================
*/

async function loadResults() {

  showLoading(
    "Loading results..."
  );


  try {

    const date =
      formatDate(selectedDate);


    const data =
      await fetchAPI(
        "results",
        `&date=${date}`
      );


    if (hasAPIError(data)) {

      showAPIError(data);
      return;

    }


    const matches =
      data.response || [];


    if (!matches.length) {

      showEmpty(
        "No completed matches found for this date."
      );

      return;

    }


    displayMatches(
      matches,
      "Results"
    );


  }

  catch (error) {

    showConnectionError(error);

  }

}


/*
====================================================
SHOW ALL MATCHES
====================================================
*/

async function showAllMatches() {

  currentPage =
    "fixtures";


  document
    .querySelectorAll(".nav-btn")
    .forEach(button =>
      button.classList.remove("active")
    );


  document
    .getElementById("nav-fixtures")
    .classList.add("active");


  await loadFixtures();

}


/*
====================================================
DISPLAY MATCHES
====================================================
*/

function displayMatches(
  matches,
  title
) {

  let html = `

    <div class="section-title">
      ${escapeHTML(title)}
    </div>

  `;


  const leagues = {};


  matches.forEach(match => {

    const league =
      match.league ||
      {};


    const leagueId =
      league.id ||
      "unknown";


    if (!leagues[leagueId]) {

      leagues[leagueId] = {

        name:
          league.name ||
          "Football",

        country:
          league.country ||
          "",

        matches: []

      };

    }


    leagues[leagueId]
      .matches
      .push(match);

  });


  Object.values(leagues)
    .forEach(league => {

      html += `

        <div class="league">

          <div class="league-header">

            <span>
              ${escapeHTML(
                league.name
              )}
            </span>

            <span class="league-country">
              ${escapeHTML(
                league.country
              )}
            </span>

          </div>

      `;


      league.matches.forEach(match => {

        const teams =
          match.teams ||
          {};


        const goals =
          match.goals ||
          {};


        const fixture =
          match.fixture ||
          {};


        const home =
          teams.home?.name ||
          "Home";


        const away =
          teams.away?.name ||
          "Away";


        const homeScore =
          goals.home;


        const awayScore =
          goals.away;


        let score =
          "- - -";


        if (
          homeScore !== null &&
          homeScore !== undefined &&
          awayScore !== null &&
          awayScore !== undefined
        ) {

          score =
            `${homeScore} - ${awayScore}`;

        }


        let status =
          fixture.status?.short ||
          "";


        let statusText =
          fixture.status?.long ||
          status;


        if (
          isLiveStatus(status)
        ) {

          const minute =
            fixture.status?.elapsed;


          statusText =
            minute
              ? `${minute}' LIVE`
              : "LIVE";

        }

        else if (
          status === "NS"
        ) {

          if (fixture.date) {

            statusText =
              new Date(
                fixture.date
              ).toLocaleTimeString(
                [],
                {
                  hour:
                    "2-digit",

                  minute:
                    "2-digit"
                }
              );

          }

        }


        const liveClass =
          isLiveStatus(status)
            ? "live"
            : "";


        html += `

          <div class="match">

            <div class="team home">
              ${escapeHTML(home)}
            </div>

            <div class="score">

              ${escapeHTML(
                String(score)
              )}

              <span class="status ${liveClass}">
                ${escapeHTML(
                  statusText
                )}
              </span>

            </div>

            <div class="team away">
              ${escapeHTML(away)}
            </div>

          </div>

        `;

      });


      html += `</div>`;

    });


  document.getElementById(
    "content"
  ).innerHTML =
    html;

}


/*
====================================================
STANDINGS SCREEN
====================================================
*/

function showStandings() {

  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="standings-box">

      <h2>
        📊 League Standings
      </h2>

      <select
        id="leagueSelect"
        class="league-select">

        <option value="39">
          🏴 Premier League
        </option>

        <option value="140">
          🇪🇸 La Liga
        </option>

        <option value="135">
          🇮🇹 Serie A
        </option>

        <option value="78">
          🇩🇪 Bundesliga
        </option>

        <option value="61">
          🇫🇷 Ligue 1
        </option>

        <option value="2">
          🇪🇺 UEFA Champions League
        </option>

      </select>


      <select
        id="seasonSelect"
        class="league-select">

        <option value="2026">
          2026 Season
        </option>

        <option value="2025">
          2025 Season
        </option>

        <option value="2024">
          2024 Season
        </option>

      </select>


      <button
        class="show-standings"
        onclick="loadStandings()">

        Show Standings

      </button>

    </div>

  `;

}


/*
====================================================
LOAD REAL STANDINGS
====================================================
*/

async function loadStandings() {

  const league =
    document.getElementById(
      "leagueSelect"
    ).value;


  const season =
    document.getElementById(
      "seasonSelect"
    ).value;


  showLoading(
    "Loading league standings..."
  );


  try {

    const data =
      await fetchAPI(
        "standings",
        `&league=${league}&season=${season}`
      );


    if (hasAPIError(data)) {

      showAPIError(data);
      return;

    }


    const leagueData =
      data.response?.[0]?.league;


    const standings =
      leagueData
        ?.standings?.[0] ||
        [];


    if (!standings.length) {

      showEmpty(
        "No standings available for this league and season."
      );

      return;

    }


    displayStandings(
      standings,
      leagueData.name ||
      "League Standings"
    );


  }

  catch (error) {

    showConnectionError(error);

  }

}


/*
====================================================
DISPLAY STANDINGS TABLE
====================================================
*/

function displayStandings(
  standings,
  leagueName
) {

  let html = `

    <div class="section-title">
      📊 ${escapeHTML(
        leagueName
      )}
    </div>

    <div class="table-wrap">

      <table class="standings-table">

        <thead>

          <tr>

            <th>#</th>

            <th>TEAM</th>

            <th>P</th>

            <th>W</th>

            <th>D</th>

            <th>L</th>

            <th>GD</th>

            <th>PTS</th>

          </tr>

        </thead>

        <tbody>

  `;


  standings.forEach(row => {

    const rank =
      row.rank ??
      "-";


    const team =
      row.team ||
      {};


    const all =
      row.all ||
      {};


    const goals =
      row.goalsDiff ??
      0;


    const points =
      row.points ??
      0;


    const played =
      all.played ??
      0;


    const wins =
      all.win ??
      0;


    const draws =
      all.draw ??
      0;


    const losses =
      all.lose ??
      0;


    const logo =
      team.logo ||
      "";


    html += `

      <tr>

        <td>
          ${rank}
        </td>


        <td>

          <div class="team-name">

            ${
              logo
                ? `
                  <img
                    class="team-logo"
                    src="${escapeAttribute(
                      logo
                    )}"
                    alt=""
                  >
                `
                : ""
            }

            <span>
              ${escapeHTML(
                team.name ||
                "Unknown Team"
              )}
            </span>

          </div>

        </td>


        <td>
          ${played}
        </td>


        <td>
          ${wins}
        </td>


        <td>
          ${draws}
        </td>


        <td>
          ${losses}
        </td>


        <td>
          ${goals}
        </td>


        <td class="points">
          ${points}
        </td>

      </tr>

    `;

  });


  html += `

        </tbody>

      </table>

    </div>

  `;


  document.getElementById(
    "content"
  ).innerHTML =
    html;

}


/*
====================================================
REFRESH
====================================================
*/

function refreshCurrentPage() {

  if (currentPage === "live") {

    loadLive();

  }

  else if (
    currentPage === "fixtures"
  ) {

    loadFixtures();

  }

  else if (
    currentPage === "results"
  ) {

    loadResults();

  }

  else if (
    currentPage === "standings"
  ) {

    showStandings();

  }

}


/*
====================================================
LIVE STATUS
====================================================
*/

function isLiveStatus(status) {

  const liveStatuses = [

    "1H",
    "2H",
    "HT",
    "ET",
    "BT",
    "P",
    "LIVE"

  ];


  return liveStatuses.includes(
    status
  );

}


/*
====================================================
API ERROR
====================================================
*/

function hasAPIError(data) {

  return (
    data &&
    data.errors &&
    Object.keys(data.errors).length > 0
  );

}


function showAPIError(data) {

  let message =
    "Unable to load football data.";


  if (data?.errors) {

    const errors =
      Object.values(
        data.errors
      );


    if (errors.length) {

      message =
        errors.join(" ");

    }

  }


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="error">

      ${escapeHTML(message)}

    </div>

  `;

}


/*
====================================================
CONNECTION ERROR
====================================================
*/

function showConnectionError(error) {

  console.error(error);


  document.getElementById(
    "content"
  ).innerHTML = `

    <div class="error">

      Unable to load football data.

      <br><br>

      Please check your internet connection
      and try again.

    </div>

  `;

}

  `;

}


/*
====================================================
SECURITY HELPERS
====================================================
*/

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(value) {

  return escapeHTML(value);

}

setupDates();

loadLive();
