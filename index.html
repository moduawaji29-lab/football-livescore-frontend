<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071426">

<title>M.awajilivescores</title>

<style>
:root{
  --navy:#071426;
  --navy2:#0d2948;
  --blue:#08b9f5;
  --blue2:#087ee8;
  --red:#ef233c;
  --green:#12b76a;
  --bg:#f3f6fa;
  --white:#fff;
  --text:#102033;
  --muted:#718096;
  --border:#e4eaf0;
  --shadow:0 5px 20px rgba(10,30,55,.07);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */

header{
  background:linear-gradient(135deg,#061221,#0d2948);
  color:white;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 3px 18px rgba(0,0,0,.18);
}

.header{
  max-width:1150px;
  min-height:76px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:45px;
  height:45px;
  border-radius:13px;
  background:linear-gradient(135deg,var(--blue),var(--blue2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:900;
  box-shadow:0 6px 20px rgba(8,185,245,.3);
}

.brand-name{
  font-size:21px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand-name .blue{
  color:var(--blue);
}

.tagline{
  font-size:8px;
  letter-spacing:2.2px;
  color:#aebfd0;
  margin-top:4px;
}

.live-pill{
  display:flex;
  align-items:center;
  gap:7px;
  padding:8px 12px;
  border-radius:22px;
  background:rgba(239,35,60,.14);
  border:1px solid rgba(239,35,60,.4);
  color:#ff6677;
  font-size:11px;
  font-weight:800;
}

.live-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--red);
  animation:pulse 1.3s infinite;
}

@keyframes pulse{
  50%{opacity:.35}
}

/* NAVIGATION */

nav{
  background:white;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:76px;
  z-index:90;
}

.nav{
  max-width:1150px;
  margin:auto;
  display:flex;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{
  display:none;
}

.nav button{
  border:0;
  background:none;
  padding:15px 17px;
  white-space:nowrap;
  color:var(--muted);
  font-size:13px;
  font-weight:800;
  cursor:pointer;
}

.nav button.active{
  color:var(--blue2);
  border-bottom:3px solid var(--blue);
}

/* MAIN */

main{
  max-width:1150px;
  margin:auto;
  padding:22px 13px 60px;
}

.top{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.title{
  font-size:26px;
  font-weight:900;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.refresh{
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  padding:10px 14px;
  font-weight:800;
  cursor:pointer;
}

/* SEARCH */

.search-box{
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px 13px;
  display:flex;
  align-items:center;
  gap:9px;
  margin-bottom:16px;
  box-shadow:var(--shadow);
}

.search-box span{
  font-size:18px;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  font-size:14px;
  background:transparent;
}

/* DATES */

.dates{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:18px;
  scrollbar-width:none;
}

.dates::-webkit-scrollbar{
  display:none;
}

.date{
  min-width:82px;
  padding:11px 8px;
  background:white;
  border:1px solid var(--border);
  border-radius:11px;
  text-align:center;
  cursor:pointer;
}

.date strong{
  display:block;
  font-size:11px;
}

.date small{
  display:block;
  color:var(--muted);
  margin-top:4px;
  font-size:10px;
}

.date.active{
  background:var(--navy);
  color:white;
}

.date.active small{
  color:#b7c7d8;
}

/* STATUS */

.status{
  background:white;
  border:1px solid var(--border);
  border-radius:16px;
  padding:42px 20px;
  text-align:center;
  box-shadow:var(--shadow);
}

.status-icon{
  font-size:36px;
  margin-bottom:13px;
}

.status h2{
  font-size:19px;
  margin-bottom:8px;
}

.status p{
  max-width:560px;
  margin:auto;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.retry{
  margin-top:18px;
  padding:11px 21px;
  border:0;
  border-radius:9px;
  background:var(--navy);
  color:white;
  font-weight:800;
  cursor:pointer;
}

/* LOADER */

.loader{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:18px;
}

.loader i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--blue);
  animation:load .8s infinite alternate;
}

.loader i:nth-child(2){
  animation-delay:.2s;
}

.loader i:nth-child(3){
  animation-delay:.4s;
}

@keyframes load{
  to{
    transform:translateY(-8px);
    opacity:.25;
  }
}

/* LEAGUE */

.league{
  background:white;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.league-head{
  background:#f8fafc;
  border-bottom:1px solid var(--border);
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.league-title{
  font-size:13px;
  font-weight:900;
}

.country{
  color:var(--muted);
  font-size:10px;
}

.match{
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  padding:17px 14px;
  border-bottom:1px solid #edf0f3;
  cursor:pointer;
}

.match:last-child{
  border-bottom:0;
}

.match:hover{
  background:#fbfdff;
}

.team{
  font-size:13px;
  font-weight:800;
}

.home{
  text-align:right;
}

.away{
  text-align:left;
}

.score{
  text-align:center;
}

.score-number{
  font-size:18px;
  font-weight:900;
}

.match-status{
  margin-top:4px;
  font-size:10px;
  font-weight:800;
}

.live-status{
  color:var(--red);
}

.finished-status{
  color:var(--muted);
}

/* STANDINGS */

.standings-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.standings-controls select{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  background:white;
  border-radius:10px;
  outline:none;
  font-weight:700;
}

.table-wrap{
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  overflow:auto;
  box-shadow:var(--shadow);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:550px;
}

th{
  background:var(--navy);
  color:white;
  padding:11px 8px;
  font-size:10px;
  text-align:center;
}

td{
  padding:12px 8px;
  border-bottom:1px solid #edf0f3;
  text-align:center;
  font-size:12px;
}

.team-cell{
  text-align:left;
  font-weight:800;
}

/* MATCH MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(3,14,28,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:500;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:20px 20px 0 0;
  padding:22px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  border:0;
  background:#f0f3f6;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:20px;
  cursor:pointer;
}

.match-detail{
  text-align:center;
}

.detail-league{
  color:var(--muted);
  font-size:12px;
  margin-bottom:20px;
}

.detail-teams{
  display:grid;
  grid-template-columns:1fr 100px 1fr;
  align-items:center;
}

.detail-team{
  font-size:15px;
  font-weight:900;
}

.detail-score{
  font-size:27px;
  font-weight:900;
}

.detail-status{
  color:var(--red);
  font-size:11px;
  font-weight:900;
  margin-top:5px;
}

.detail-section{
  margin-top:24px;
  border-top:1px solid var(--border);
  padding-top:18px;
}

.detail-section h3{
  font-size:14px;
  margin-bottom:10px;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
  color:var(--muted);
  font-size:12px;
}

/* FOOTER */

footer{
  background:var(--navy);
  color:#8fa4b9;
  text-align:center;
  padding:30px 15px;
  font-size:11px;
}

.footer-name{
  color:white;
  font-size:16px;
  font-weight:900;
  margin-bottom:7px;
}

.footer-name span{
  color:var(--blue);
}

/* MOBILE */

@media(max-width:500px){

  .brand-name{
    font-size:18px;
  }

  .logo{
    width:41px;
    height:41px;
  }

  .live-pill{
    padding:7px 9px;
  }

  .title{
    font-size:23px;
  }

  .refresh{
    padding:9px 11px;
  }

  .match{
    grid-template-columns:1fr 72px 1fr;
    padding:16px 10px;
  }

  .team{
    font-size:12px;
  }

  .score-number{
    font-size:16px;
  }

  .standings-controls{
    grid-template-columns:1fr;
  }
}

@media(min-width:700px){

  main{
    padding-top:32px;
  }

  .match{
    padding:19px 22px;
  }

  .modal{
    align-items:center;
    padding:20px;
  }

  .modal-card{
    border-radius:18px;
  }
}
</style>
</head>

<body>

<!-- HEADER -->

<header>

  <div class="header">

    <div class="brand">

      <div class="logo">
        M
      </div>

      <div>

        <div class="brand-name">
          M.<span class="blue">awaji</span>livescores
        </div>

        <div class="tagline">
          LIVE FOOTBALL SCORES
        </div>

      </div>

    </div>

    <div class="live-pill">
      <span class="live-dot"></span>
      LIVE
    </div>

  </div>

</header>


<!-- NAVIGATION -->

<nav>

  <div class="nav">

    <button
      class="active"
      onclick="changePage('live',this)">
      🔴 Live
    </button>

    <button
      onclick="changePage('all',this)">
      ⚽ All Matches
    </button>

    <button
      onclick="changePage('fixtures',this)">
      📅 Fixtures
    </button>

    <button
      onclick="changePage('results',this)">
      ✓ Results
    </button>

    <button
      onclick="changePage('standings',this)">
      🏆 Standings
    </button>

  </div>

</nav>


<!-- MAIN -->

<main>

  <div class="top">

    <div>

      <div
        class="title"
        id="pageTitle">
        Live Scores
      </div>

      <div
        class="subtitle"
        id="pageSubtitle">
        Follow football action as it happens
      </div>

    </div>

    <button
      class="refresh"
      onclick="loadPage()">
      ↻ Refresh
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <span>🔎</span>

    <input
      id="search"
      type="search"
      placeholder="Search teams or leagues..."
      oninput="filterMatches()">

  </div>


  <!-- DATES -->

  <div class="dates">

    <button
      class="date active"
      onclick="selectDate(0,this)">

      <strong>TODAY</strong>

      <small id="today"></small>

    </button>


    <button
      class="date"
      onclick="selectDate(-1,this)">

      <strong>YESTERDAY</strong>

      <small id="yesterday"></small>

    </button>


    <button
      class="date"
      onclick="selectDate(1,this)">

      <strong>TOMORROW</strong>

      <small id="tomorrow"></small>

    </button>

  </div>


  <section id="content"></section>

</main>


<!-- FOOTER -->

<footer>

  <div class="footer-name">
    M.<span>awaji</span>livescores
  </div>

  <div>
    Live football scores • Fixtures • Results • Standings
  </div>

</footer>


<!-- MATCH DETAILS -->

<div
  class="modal"
  id="modal">

  <div class="modal-card">

    <div class="modal-top">

      <strong>
        Match Details
      </strong>

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

    </div>

    <div id="modalContent"></div>

  </div>

</div>


<script>

/* BACKEND */

const API_BASE =
  "https://football-livescore-backend-new.vercel.app/api";


let currentPage = "live";

let selectedDate = new Date();

let allMatches = [];


/* DATE FUNCTIONS */

function isoDate(date){

  return date
    .toISOString()
    .split("T")[0];

}


function shortDate(date){

  return date.toLocaleDateString(
    "en-US",
    {
      month:"short",
      day:"numeric"
    }
  );

}


function setupDates(){

  const today =
    new Date();

  const yesterday =
    new Date(today);

  yesterday.setDate(
    today.getDate() - 1
  );


  const tomorrow =
    new Date(today);

  tomorrow.setDate(
    today.getDate() + 1
  );


  document.getElementById(
    "today"
  ).textContent =
    shortDate(today);


  document.getElementById(
    "yesterday"
  ).textContent =
    shortDate(yesterday);


  document.getElementById(
    "tomorrow"
  ).textContent =
    shortDate(tomorrow);

}


/* API */

async function api(action,params=""){

  const response =
    await fetch(
      `${API_BASE}?action=${action}${params}`
    );

  return await response.json();

}


/* CHANGE PAGE */

function changePage(page,button){

  currentPage =
    page;


  document
    .querySelectorAll(".nav button")
    .forEach(btn =>
      btn.classList.remove("active")
    );


  button.classList.add("active");


  const title =
    document.getElementById(
      "pageTitle"
    );


  const subtitle =
    document.getElementById(
      "pageSubtitle"
    );


  if(page === "live"){

    title.textContent =
      "Live Scores";

    subtitle.textContent =
      "Follow football action as it happens";

  }


  if(page === "all"){

    title.textContent =
      "All Matches";

    subtitle.textContent =
      "All football matches for the selected date";

  }


  if(page === "fixtures"){

    title.textContent =
      "Fixtures";

    subtitle.textContent =
      "Upcoming football matches";

  }


  if(page === "results"){

    title.textContent =
      "Results";

    subtitle.textContent =
      "Completed football matches";

  }


  if(page === "standings"){

    title.textContent =
      "Standings";

    subtitle.textContent =
      "League tables and rankings";

  }


  document.getElementById(
    "search"
  ).value = "";


  loadPage();

}


/* LOAD CURRENT PAGE */

function loadPage(){

  if(currentPage === "live"){
    loadLive();
  }

  else if(currentPage === "all"){
    loadAllMatches();
  }

  else if(currentPage === "fixtures"){
    loadFixtures();
  }

  else if(currentPage === "results"){
    loadResults();
  }

  else if(currentPage === "standings"){
    showStandings();
  }

}


/* LIVE */

async function loadLive(){

  showLoading();

  try{

    const data =
      await api("live");


    if(hasError(data)){

      showUnavailable();

      return;

    }


    allMatches =
      data.response || [];


    if(allMatches.length === 0){

      showEmpty(
        "No live matches",
        "There are currently no live football matches available."
      );

      return;

    }


    displayMatches(allMatches);

  }

  catch(error){

    showConnectionError();

  }

}


/* ALL MATCHES */

async function loadAllMatches(){

  showLoading();

  try{

    const data =
      await api(
        "fixtures",
        `&date=${isoDate(selectedDate)}`
      );


    if(hasError(data)){

      showUnavailable();

      return;

    }


    allMatches =
      data.response || [];


    if(allMatches.length === 0){

      showEmpty(
        "No matches",
        "There are no football matches available for this date."
      );

      return;

    }


    displayMatches(allMatches);

  }

  catch(error){

    showConnectionError();

  }

}


/* FIXTURES */

async function loadFixtures(){

  showLoading();

  try{

    const data =
      await api(
        "fixtures",
        `&date=${isoDate(selectedDate)}`
      );


    if(hasError(data)){

      showUnavailable();

      return;

    }


    allMatches =
      data.response || [];


    if(allMatches.length === 0){

      showEmpty(
        "No fixtures",
        "No upcoming fixtures were returned for this date."
      );

      return;

    }


    displayMatches(allMatches);

  }

  catch(error){

    showConnectionError();

  }

}


/* RESULTS */

async function loadResults(){

  showLoading();

  try{

    const data =
      await api(
        "results",
        `&date=${isoDate(selectedDate)}`
      );


    if(hasError(data)){

      showUnavailable();

      return;

    }


    allMatches =
      data.response || [];


    if(allMatches.length === 0){

      showEmpty(
        "No results",
        "No completed matches were returned for this date."
      );

      return;

    }


    displayMatches(allMatches);

  }

  catch(error){

    showConnectionError();

  }

}


/* DISPLAY MATCHES */

function displayMatches(matches){

  const content =
    document.getElementById(
      "content"
    );


  if(!matches.length){

    showEmpty(
      "No matches found",
      "No matches match your search."
    );

    return;

  }


  const leagues = {};


  matches.forEach(match => {

    const name =
      match.league?.name ||
      "Football";


    if(!leagues[name]){

      leagues[name] = {

        country:
          match.league?.country || "",

        matches:[]

      };

    }


    leagues[name].matches.push(
      match
    );

  });


  let html = "";


  Object.keys(leagues)
    .forEach(name => {

      const league =
        leagues[name];


      html += `

        <div class="league">

          <div class="league-head">

            <div class="league-title">
              ${escapeHTML(name)}
            </div>

            <div class="country">
              ${escapeHTML(league.country)}
            </div>

          </div>

      `;


      league.matches.forEach(match => {

        const home =
          match.teams?.home?.name ||
          "Home";


        const away =
          match.teams?.away?.name ||
          "Away";


        const hs =
          match.goals?.home ?? "-";


        const as =
          match.goals?.away ?? "-";


        const status =
          match.fixture?.status?.short ||
          "";


        const elapsed =
          match.fixture?.status?.elapsed;


        let statusText =
          status;


        if(elapsed){

          statusText =
            `${elapsed}'`;

        }


        const matchId =
          Number(
            match.fixture?.id
          ) || 0;


        html += `

          <div
            class="match"
            onclick="openMatch(${matchId})">

            <div class="team home">
              ${escapeHTML(home)}
            </div>

            <div class="score">

              <div class="score-number">
                ${hs} - ${as}
              </div>

              <div class="
                match-status
                ${
                  isLive(status)
                  ? "live-status"
                  : "finished-status"
                }
              ">

                ${
                  isLive(status)
                  ? "● " +
                    escapeHTML(statusText)
                  : escapeHTML(statusText)
                }

              </div>

            </div>

            <div class="team away">
              ${escapeHTML(away)}
            </div>

          </div>

        `;

      });


      html += `
        </div>
      `;

    });


  content.innerHTML =
    html;

}


/* SEARCH */

function filterMatches(){

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  if(!query){

    displayMatches(
      allMatches
    );

    return;

  }


  const filtered =
    allMatches.filter(match => {

      const home =
        match.teams?.home?.name ||
        "";

      const away =
        match.teams?.away?.name ||
        "";

      const league =
        match.league?.name ||
        "";


      return (

        home
          .toLowerCase()
          .includes(query)

        ||

        away
          .toLowerCase()
          .includes(query)

        ||

        league
          .toLowerCase()
          .includes(query)

      );

    });


  displayMatches(
    filtered
  );

}


/* DATE */

function selectDate(offset,button){

  const today =
    new Date();


  selectedDate =
    new Date(today);


  selectedDate.setDate(
    today.getDate() + offset
  );


  document
    .querySelectorAll(".date")
    .forEach(btn =>

/* LOAD STANDINGS */

async function loadStandings(){

  const league =
    document.getElementById(
      "leagueSelect"
    ).value;


  const season =
    document.getElementById(
      "seasonSelect"
    ).value;


  const result =
    document.getElementById(
      "standingsResult"
    );


  if(!league || !season){

    result.innerHTML = `

      <div class="status">

        <div class="status-icon">
          🏆
        </div>

        <h2>
          Select a league and season
        </h2>

        <p>
          Choose both options above to load
          the real league standings.
        </p>

      </div>

    `;

    return;

  }


  result.innerHTML = `

    <div class="status">

      <h2>
        Loading standings
      </h2>

      <div class="loader">
        <i></i>
        <i></i>
        <i></i>
      </div>

    </div>

  `;


  try{

    const data =
      await api(
        "standings",
        `&league=${league}&season=${season}`
      );


    if(hasError(data)){

      result.innerHTML = `

        <div class="status">

          <div class="status-icon">
            ⚠️
          </div>

          <h2>
            Standings unavailable
          </h2>

          <p>
            The football data service is
            currently unavailable.
          </p>

        </div>

      `;

      return;

    }


    const groups =
      data.response || [];


    if(!groups.length){

      result.innerHTML = `

        <div class="status">

          <h2>
            No standings available
          </h2>

          <p>
            No standings were returned for
            this league.
          </p>

        </div>

      `;

      return;

    }


    let html = "";


    groups.forEach(group => {

      const standings =
        group.league?.standings?.[0] ||
        [];


      html += `

        <div class="table-wrap">

          <table>

            <thead>

              <tr>
                <th>#</th>
                <th>TEAM</th>
                <th>P</th>
                <th>W</th>
                <th>D</th>
                <th>L</th>
                <th>GD</th>
                <th>PTS</th>
              </tr>

            </thead>

            <tbody>

      `;


      standings.forEach(row => {

        html += `

          <tr>

            <td>
              ${row.rank ?? "-"}
            </td>

            <td class="team-cell">
              ${escapeHTML(
                row.team?.name || "-"
              )}
            </td>

            <td>
              ${row.all?.played ?? "-"}
            </td>

            <td>
              ${row.all?.win ?? "-"}
            </td>

            <td>
              ${row.all?.draw ?? "-"}
            </td>

            <td>
              ${row.all?.lose ?? "-"}
            </td>

            <td>
              ${row.goalsDiff ?? "-"}
            </td>

            <td>
              <strong>
                ${row.points ?? "-"}
              </strong>
            </td>

          </tr>

        `;

      });


      html += `

            </tbody>

          </table>

        </div>

      `;

    });


    result.innerHTML =
      html;

  }

  catch(error){

    result.innerHTML = `

      <div class="status">

        <div class="status-icon">
          ⚠️
        </div>

        <h2>
          Connection error
        </h2>

        <p>
          We could not connect to the
          football data service.
        </p>

      </div>

    `;

  }

}


/* MATCH DETAILS */

async function openMatch(id){

  if(!id){
    return;
  }


  const modal =
    document.getElementById(
      "modal"
    );


  const box =
    document.getElementById(
      "modalContent"
    );


  modal.classList.add(
    "show"
  );


  box.innerHTML = `

    <div class="status">

      <div class="status-icon">
        ⚽
      </div>

      <h2>
        Loading match
      </h2>

      <div class="loader">
        <i></i>
        <i></i>
        <i></i>
      </div>

    </div>

  `;


  try{

    const data =
      await api(
        "match",
        `&id=${id}`
      );


    if(
      hasError(data) ||
      !data.response ||
      !data.response.length
    ){

      box.innerHTML = `

        <div class="status">

          <div class="status-icon">
            ⚠️
          </div>

          <h2>
            Match details unavailable
          </h2>

          <p>
            The match details could not
            be loaded.
          </p>

        </div>

      `;

      return;

    }


    const match =
      data.response[0];


    const home =
      match.teams?.home?.name ||
      "Home";


    const away =
      match.teams?.away?.name ||
      "Away";


    const hs =
      match.goals?.home ?? "-";


    const as =
      match.goals?.away ?? "-";


    const status =
      match.fixture?.status?.short ||
      "";


    const venue =
      match.fixture?.venue?.name ||
      "Venue unavailable";


    const date =
      match.fixture?.date
      ? new Date(
          match.fixture.date
        ).toLocaleString()
      : "";


    box.innerHTML = `

      <div class="match-detail">

        <div class="detail-league">

          ${escapeHTML(
            match.league?.name ||
            "Football"
          )}

          ${
            match.league?.country
            ? " • " +
              escapeHTML(
                match.league.country
              )
            : ""
          }

        </div>


        <div class="detail-teams">

          <div class="detail-team">
            ${escapeHTML(home)}
          </div>

          <div>

            <div class="detail-score">
              ${hs} - ${as}
            </div>

            <div class="detail-status">
              ${escapeHTML(status)}
            </div>

          </div>

          <div class="detail-team">
            ${escapeHTML(away)}
          </div>

        </div>


        <div class="detail-section">

          <h3>
            Match Information
          </h3>


          <div class="detail-row">

            <span>
              Date
            </span>

            <strong>
              ${escapeHTML(date)}
            </strong>

          </div>


          <div class="detail-row">

            <span>
              Venue
            </span>

            <strong>
              ${escapeHTML(venue)}
            </strong>

          </div>

        </div>

      </div>

    `;

  }

  catch(error){

    box.innerHTML = `

      <div class="status">

        <div class="status-icon">
          ⚠️
        </div>

        <h2>
          Connection error
        </h2>

        <p>
          We could not load this match.
        </p>

      </div>

    `;

  }

}

/* HELPERS */

function isLive(status){

  return [
    "1H",
    "2H",
    "HT",
    "ET",
    "P",
    "LIVE"
  ].includes(status);

}


function hasError(data){

  return (
    data &&
    data.errors &&
    Object.keys(data.errors).length > 0
  );

}

function escapeHTML(value){

  const div =
    document.createElement("div");

  div.textContent =
    String(value ?? "");

  return div.innerHTML;

}
