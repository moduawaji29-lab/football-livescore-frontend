<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b3a">
<meta name="description" content="M.Awaji Livescores - Live football scores, fixtures, results, standings and match statistics.">
<title>M.Awaji Livescores</title>

<style>
:root{
  --navy:#071b3a;
  --navy2:#0d2a55;
  --blue:#1464f4;
  --green:#18a957;
  --red:#e53935;
  --orange:#f59e0b;
  --bg:#f3f6fa;
  --card:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --border:#e1e6ee;
  --soft:#eef3f9;
  --shadow:0 5px 18px rgba(7,27,58,.07);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  transition:.25s;
}

body.dark{
  --bg:#08111f;
  --card:#101c2d;
  --text:#f4f7fb;
  --muted:#aab4c4;
  --border:#24344b;
  --soft:#17253a;
  --shadow:0 5px 20px rgba(0,0,0,.25);
}

/* HEADER */
header{
  background:linear-gradient(135deg,var(--navy),var(--navy2));
  color:white;
  padding:18px 15px 14px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 3px 15px rgba(0,0,0,.2);
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:14px;
  background:white;
  color:var(--navy);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

.brand h1{
  margin:0;
  font-size:21px;
}

.brand small{
  display:block;
  margin-top:3px;
  opacity:.75;
  font-size:10px;
  letter-spacing:1.2px;
}

.header-actions{
  display:flex;
  gap:8px;
}

.icon-btn{
  border:0;
  width:40px;
  height:40px;
  border-radius:12px;
  background:rgba(255,255,255,.12);
  color:white;
  cursor:pointer;
  font-size:18px;
}

/* NAV */
nav{
  max-width:1100px;
  margin:13px auto 0;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}

nav::-webkit-scrollbar{
  display:none;
}

nav button{
  flex:0 0 auto;
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:rgba(255,255,255,.10);
  color:white;
  cursor:pointer;
  font-weight:700;
}

nav button.active{
  background:white;
  color:var(--navy);
}

/* MAIN */
main{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

/* TOOLBAR */
.toolbar{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:14px;
}

.search-row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.search-box{
  flex:1 1 220px;
  position:relative;
}

.search-box input{
  width:100%;
  padding:13px 14px 13px 40px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:12px;
  outline:none;
}

.search-icon{
  position:absolute;
  left:14px;
  top:12px;
}

.filters{
  display:flex;
  gap:8px;
  margin-top:9px;
  flex-wrap:wrap;
}

.filters select,
.filters button{
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  border-radius:10px;
  padding:10px 12px;
  cursor:pointer;
}

.filters button.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

/* DATE BAR */
.date-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:15px;
  scrollbar-width:none;
}

.date-bar::-webkit-scrollbar{
  display:none;
}

.date-btn{
  flex:1 0 105px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:14px;
  padding:12px 8px;
  cursor:pointer;
  box-shadow:var(--shadow);
}

.date-btn strong{
  display:block;
  font-size:14px;
}

.date-btn small{
  display:block;
  margin-top:4px;
  color:var(--muted);
}

.date-btn.active{
  background:var(--blue);
  border-color:var(--blue);
  color:white;
}

.date-btn.active small{
  color:white;
}

/* STATUS */
.page-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 12px;
  color:var(--muted);
  font-size:13px;
}

.live-dot{
  display:inline-block;
  width:8px;
  height:8px;
  background:#22c55e;
  border-radius:50%;
  margin-right:5px;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.75)}
}

/* LEAGUE */
.league{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.league-header{
  padding:13px 15px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.league-title{
  display:flex;
  align-items:center;
  gap:9px;
}

.league-title strong{
  font-size:14px;
}

.league-country{
  color:var(--muted);
  font-size:11px;
}

.league-count{
  color:var(--muted);
  font-size:11px;
}

/* MATCH */
.match{
  padding:13px 12px;
  border-top:1px solid var(--border);
  cursor:pointer;
  transition:.2s;
}

.match:hover{
  background:var(--soft);
}

.match:active{
  transform:scale(.995);
}

.match-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.match-time{
  color:var(--muted);
  font-size:11px;
}

.match-status{
  font-size:10px;
  font-weight:900;
  border-radius:20px;
  padding:4px 7px;
}

.status-live{
  background:#fee2e2;
  color:#dc2626;
}

.status-ft{
  background:var(--soft);
  color:var(--muted);
}

.status-upcoming{
  background:#e8f0ff;
  color:#175cd3;
}

.match-body{
  display:grid;
  grid-template-columns:1fr 65px 1fr;
  align-items:center;
  gap:8px;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
  min-width:0;
}

.team.away{
  justify-content:flex-end;
  text-align:right;
}

.team-logo{
  width:35px;
  height:35px;
  object-fit:contain;
  flex:0 0 35px;
}

.team-name{
  font-weight:700;
  font-size:14px;
  line-height:1.2;
  overflow:hidden;
  text-overflow:ellipsis;
}

.score{
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.score small{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:600;
  margin-top:2px;
}

.score.live-score{
  color:#dc2626;
}

.goal-change{
  animation:scoreFlash 1.2s ease;
}

@keyframes scoreFlash{
  0%{transform:scale(1)}
  30%{transform:scale(1.25)}
  100%{transform:scale(1)}
}

.star{
  border:0;
  background:none;
  cursor:pointer;
  font-size:19px;
  padding:2px;
}

.star.active{
  color:#f59e0b;
}

/* DETAILS */
.match-details{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.back-button{
  margin:14px;
  border:0;
  background:var(--soft);
  color:var(--text);
  border-radius:10px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:700;
}

.details-header{
  padding:18px;
  text-align:center;
  background:var(--soft);
}

.details-league{
  font-weight:800;
  font-size:15px;
}

.details-country{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.details-status{
  display:inline-block;
  margin-top:9px;
  padding:6px 11px;
  border-radius:20px;
  background:#dbeafe;
  color:#1d4ed8;
  font-size:11px;
  font-weight:900;
}

.details-status.live{
  background:#fee2e2;
  color:#dc2626;
}

.details-teams{
  padding:25px 15px;
  display:grid;
  grid-template-columns:1fr 90px 1fr;
  align-items:center;
  gap:8px;
}

.details-team{
  text-align:center;
}

.details-team img{
  width:70px;
  height:70px;
  object-fit:contain;
}

.details-team h2{
  margin:9px 0 0;
  font-size:16px;
}

.details-score{
  text-align:center;
  font-size:30px;
  font-weight:900;
}

.details-vs{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.details-info{
  padding:0 15px 15px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.info-box{
  background:var(--soft);
  border-radius:12px;
  padding:12px;
}

.info-box small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:4px;
}

.info-box strong{
  font-size:12px;
}

.details-section{
  padding:15px;
  border-top:1px solid var(--border);
}

.details-section-title{
  font-size:14px;
  font-weight:900;
  margin-bottom:12px;
}

.event-row{
  display:grid;
  grid-template-columns:1fr 55px 1fr;
  align-items:center;
  gap:6px;
  padding:8px 0;
  border-bottom:1px solid var(--border);
  font-size:12px;
}

.event-home{
  text-align:right;
}

.event-away{
  text-align:left;
}

.event-time{
  text-align:center;
  font-weight:900;
  color:var(--muted);
}

.stat-row{
  padding:9px 0;
}

.stat-names{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  font-weight:700;
}

.stat-bar{
  height:7px;
  background:var(--soft);
  border-radius:10px;
  margin-top:7px;
  overflow:hidden;
}

.stat-home{
  height:100%;
  background:var(--blue);
}

.no-data{
  text-align:center;
  color:var(--muted);
  padding:15px;
  font-size:13px;
}

/* STANDINGS */
.standings-controls{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:13px;
  margin-bottom:15px;
  box-shadow:var(--shadow);
}

.standings-controls select{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--soft);
  color:var(--text);
  margin-bottom:8px;
}

.table-wrap{
  overflow-x:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:11px 8px;
  border-bottom:1px solid var(--border);
  text-align:center;
  font-size:12px;
}

th{
  background:var(--soft);
  color:var(--muted);
  font-size:10px;
}

.team-cell{
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  font-weight:700;
}

.team-cell img{
  width:28px;
  height:28px;
  object-fit:contain;
}

/* LOADING */
.loading{
  text-align:center;
  padding:45px 15px;
  color:var(--muted);
}

.spinner{
  width:34px;
  height:34px;
  border:4px solid var(--border);
  border-top-color:var(--blue);
  border-radius:50%;
  margin:0 auto 12px;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:14px;
  margin:10px 0;
  font-size:13px;
}

body.dark .error{
  background:#35171b;
  color:#fecaca;
}

.empty{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:40px 15px;
  text-align:center;
  color:var(--muted);
}

/* FOOTER */
footer{
  text-align:center;
  color:var(--muted);
  padding:30px 15px 40px;
  font-size:11px;
}

/* MOBILE */
@media(max-width:600px){
  header{
    padding-top:14px;
  }

  .brand h1{
    font-size:18px;
  }

  .logo{
    width:42px;
    height:42px;
    font-size:23px;
  }

  main{
    padding:10px;
  }

  .match-body{
    grid-template-columns:1fr 55px 1fr;
  }

  .team-name{
    font-size:12px;
  }

  .team-logo{
    width:31px;
    height:31px;
    flex-basis:31px;
  }

  .details-teams{
    grid-template-columns:1fr 70px 1fr;
  }

  .details-team img{
    width:55px;
    height:55px;
  }

  .details-team h2{
    font-size:13px;
  }

  .details-score{
    font-size:25px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="logo">M</div>
      <div>
        <h1>M.awajilivescores</h1>
        <small>LIVE FOOTBALL SCORES</small>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn" onclick="toggleDarkMode()" title="Dark mode">
        🌙
      </button>

      <button class="icon-btn" onclick="refreshCurrentPage()" title="Refresh">
        ↻
      </button>
    </div>

  </div>

  <nav>
    <button id="nav-live" class="active" onclick="showPage('live')">
      🔴 Live
    </button>

    <button id="nav-fixtures" onclick="showPage('fixtures')">
      📅 Fixtures
    </button>

    <button id="nav-results" onclick="showPage('results')">
      🏁 Results
    </button>

    <button id="nav-standings" onclick="showPage('standings')">
      🏆 Standings
    </button>

    <button id="nav-favorites" onclick="showPage('favorites')">
      ⭐ Favorites
    </button>
  </nav>
</header>

<main id="app">

  <div class="toolbar" id="toolbar">

    <div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔎</span>
        <input
          id="searchInput"
          type="search"
          placeholder="Search team or league..."
          oninput="applyFilters()"
        >
      </div>
    </div>

    <div class="filters">

      <select id="leagueFilter" onchange="applyFilters()">
        <option value="">All leagues</option>
      </select>

      <button id="filterAll" class="active" onclick="setStatusFilter('all')">
        All
      </button>

      <button id="filterLive" onclick="setStatusFilter('live')">
        🔴 Live
      </button>

      <button id="filterUpcoming" onclick="setStatusFilter('upcoming')">
        Upcoming
      </button>

      <button id="filterFinished" onclick="setStatusFilter('finished')">
        Finished
      </button>

    </div>
  </div>

  <div id="dateBar" class="date-bar"></div>

  <div id="content"></div>

</main>

<footer>
  <strong>M.awajilivescores</strong><br>
  Real football scores, fixtures, results and standings.<br><br>
  © 2026 M.Awaji Livescores
</footer>

<script>

const API_BASE =
  "https://football-livescore-backend-new.vercel.app/api";

let currentPage = "live";
let selectedDate = getDateString(0);
let statusFilter = "all";
let allMatches = [];
let currentMatchData = null;

const favoriteTeams =
  JSON.parse(localStorage.getItem("mawaji_favorite_teams") || "[]");

const previousScores =
  JSON.parse(localStorage.getItem("mawaji_previous_scores") || "{}");


/* =========================
   DATE FUNCTIONS
========================= */

function getDateString(offset){

  const date = new Date();

  date.setDate(date.getDate() + offset);

  const year = date.getFullYear();
  const month = String(date.getMonth()+1).padStart(2,"0");
  const day = String(date.getDate()).padStart(2,"0");

  return `${year}-${month}-${day}`;
}


function formatDate(dateString){

  const date = new Date(dateString + "T12:00:00");

  return date.toLocaleDateString(undefined,{
    weekday:"short",
    day:"numeric",
    month:"short"
  });
}


function renderDateBar(){

  const dates = [
    {offset:-1,label:"Yesterday"},
    {offset:0,label:"Today"},
    {offset:1,label:"Tomorrow"}
  ];

  document.getElementById("dateBar").innerHTML =
    dates.map(item => {

      const date = getDateString(item.offset);

      return `
        <button
          class="date-btn ${selectedDate === date ? "active" : ""}"
          onclick="selectDate('${date}')"
        >
          <strong>${item.label}</strong>
          <small>${formatDate(date)}</small>
        </button>
      `;

    }).join("");
}


function selectDate(date){

  selectedDate = date;

  renderDateBar();

  if(currentPage === "fixtures"){
    loadFixtures();
  }

  else if(currentPage === "results"){
    loadResults();
  }

  else if(currentPage === "live"){
    loadLive();
  }
}


/* =========================
   API
========================= */

async function fetchAPI(action, extra=""){

  const url =
    `${API_BASE}?action=${action}${extra}`;

  const response = await fetch(url);

  const data = await response.json();

  if(!response.ok){

    throw new Error(
      data?.error || "API request failed"
    );
  }

  return data;
}


/* =========================
   NAVIGATION
========================= */

function showPage(page){

  currentPage = page;

  document.querySelectorAll("nav button")
    .forEach(btn => btn.classList.remove("active"));

  const nav =
    document.getElementById("nav-" + page);

  if(nav){
    nav.classList.add("active");
  }

  document.getElementById("toolbar").style.display =
    page === "standings" ? "none" : "block";

  document.getElementById("dateBar").style.display =
    page === "standings" ? "none" : "flex";

  if(page !== "favorites"){
    document.getElementById("searchInput").value = "";
  }

  if(page === "live"){
    loadLive();
  }

  else if(page === "fixtures"){
    loadFixtures();
  }

  else if(page === "results"){
    loadResults();
  }

  else if(page === "standings"){
    showStandings();
  }

  else if(page === "favorites"){
    loadFavorites();
  }
}


function refreshCurrentPage(){

  if(currentPage === "live"){
    loadLive();
  }

  else if(currentPage === "fixtures"){
    loadFixtures();
  }

  else if(currentPage === "results"){
    loadResults();
  }

  else if(currentPage === "standings"){
    showStandings();
  }

  else if(currentPage === "favorites"){
    loadFavorites();
  }
}


/* =========================
   LOADING / ERROR
========================= */

function showLoading(message="Loading football data..."){

  document.getElementById("content").innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      ${message}
    </div>
  `;
}


function showError(error){

  document.getElementById("content").innerHTML = `
    <div class="error">
      <strong>Unable to load football data.</strong><br><br>
      ${escapeHTML(error.message || "Please try again.")}
      <br><br>
      <button
        onclick="refreshCurrentPage()"
        style="padding:9px 12px;border:0;border-radius:8px;cursor:pointer;"
      >
        Try Again
      </button>
    </div>
  `;
}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   DATA NORMALIZATION
========================= */

function getMatches(data){

  if(Array.isArray(data)){
    return data;
  }

  if(Array.isArray(data?.response)){
    return data.response;
  }

  if(Array.isArray(data?.matches)){
    return data.matches;
  }

  if(Array.isArray(data?.fixtures)){
    return data.fixtures;
  }

  return [];
}


function getTeam(match, side){

  return match?.teams?.[side] ||
         match?.[side] ||
         {};
}


function getScore(match, side){

  const score = match?.goals?.[side];

  if(score !== undefined && score !== null){
    return score;
  }

  return match?.score?.fulltime?.[side] ??
         match?.score?.halftime?.[side] ??
         "-";
}


function getStatus(match){

  return match?.fixture?.status ||
         match?.status ||
         {};
}


function getMatchId(match){

  return match?.fixture?.id ||
         match?.id ||
         match?.fixture_id ||
         null;
}


function getLeague(match){

  return match?.league || {};
}


/* =========================
   MATCH STATUS
========================= */

function isLive(match){

  const status = getStatus(match);

  const short =
    String(status.short || "").toUpperCase();

  return [
    "1H","2H","HT","ET","BT",
    "P","LIVE","INT"
  ].includes(short);
}


function isFinished(match){

  const status = getStatus(match);

  const short =
    String(status.short || "").toUpperCase();

  return [
    "FT","AET","PEN"
  ].includes(short);
}


function statusText(match){

  const status = getStatus(match);

  if(isLive(match)){

    if(status.elapsed){
      return `LIVE ${status.elapsed}'`;
    }

    return "LIVE";
  }

  if(isFinished(match)){
    return status.short || "FT";
  }

  return status.long ||
         status.short ||
         "Upcoming";
}

function matchCard(match){

    previousScores[id];

  const scoreNow =

  const changed =
    oldScore &&
    oldScore !== scoreNow;

  if(id){

  }

  const homeFav =
    favoriteTeams.includes(homeName);

  const awayFav =
    favoriteTeams.includes(awayName);

  return `

    <div
      class="match ${changed ? "goal-change" : ""}"
      onclick="openMatchDetails(${Number(id) || 0})"
    >

        <span class="match-time">
          ${formatMatchTime(match)}
        </span>

        <span class="match-status ${
          live
          ? "status-live"
          : isFinished(match)
          ? "status-ft"
          : "status-upcoming"
        }">

          ${live ? '<span class="live-dot"></span>' : ""}

          ${escapeHTML(statusText(match))}

        </span>

      </div>

      <div class="match-body">

        <div class="team">

          <button
            class="star ${homeFav ? "active" : ""}"
            onclick="event.stopPropagation();toggleFavorite('${escapeAttr(homeName)}')"
            title="Favourite team"
          >
            ${homeFav ? "★" : "☆"}
          </button>

          ${logoHTML(home)}

          <span class="team-name">
            ${escapeHTML(homeName)}
          </span>

        </div>

        <div class="score ${live ? "live-score" : ""}">
          ${escapeHTML(homeScore)}
          -
          ${escapeHTML(awayScore)}

          ${
            live
            ? `<small>${escapeHTML(statusText(match))}</small>`
            : ""
          }
        </div>

        <div class="team away">

          <span class="team-name">
            ${escapeHTML(awayName)}
          </span>

          ${logoHTML(away)}

          <button
            class="star ${awayFav ? "active" : ""}"
            onclick="event.stopPropagation();toggleFavorite('${escapeAttr(awayName)}')"

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}


function formatMatchTime(match){

  const date =
    match?.fixture?.date ||
    match?.date;

  if(!date){
    return "";
  }

  try{

    return new Date(date)
      .toLocaleTimeString([],{
        hour:"2-digit",
        minute:"2-digit"

/* =========================
   FILTERS
========================= */

function populateLeagueFilter(matches){

  const select =
    document.getElementById("leagueFilter");

  const current =
    select.value;

  const leagues =
    [...new Map(
      matches.map(m => {

        const l = getLeague(m);

        return [
          l.id || l.name,
          l.name || "Football"
        ];
      })
    ).entries()]
    .sort((a,b) =>
      String(a[1]).localeCompare(String(b[1]))
    );

  select.innerHTML =
    `<option value="">All leagues</option>` +
    leagues.map(([id,name]) =>
      `<option value="${escapeHTML(id)}">
        ${escapeHTML(name)}
      </option>`
    ).join("");

  if(
    leagues.some(x => String(x[0]) === current)
  ){
    select.value = current;
  }
}


function filterMatches(matches){

  const search =
    document.getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  const league =
    document.getElementById("leagueFilter").value;

  return matches.filter(match => {

    const home =
      getTeam(match,"home");

    const away =
      getTeam(match,"away");

    const l =
      getLeague(match);

    const text =
      `${home?.name || ""} ${away?.name || ""} ${l?.name || ""}`
      .toLowerCase();

    if(search && !text.includes(search)){
      return false;
    }

    if(
      league &&
      String(l?.id || l?.name) !== String(league)
    ){
      return false;
    }

    if(statusFilter === "live" && !isLive(match)){
      return false;
    }

    if(
      statusFilter === "finished" &&
      !isFinished(match)
    ){
      return false;
    }

    if(
      statusFilter === "upcoming" &&
      (isLive(match) || isFinished(match))
    ){
      return false;
    }

    return true;
  });
}


function applyFilters(){

  if(currentPage === "favorites"){
    loadFavorites();
    return;
  }

  renderMatches(allMatches);
}


function setStatusFilter(filter){

  statusFilter = filter;

  document
    .querySelectorAll(".filters button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  const map = {
    all:"filterAll",
    live:"filterLive",
    upcoming:"filterUpcoming",
    finished:"filterFinished"
  };

  document
    .getElementById(map[filter])
    ?.classList.add("active");

  renderMatches(allMatches);
}

function renderEvents(events,homeName,awayName){

  if(!Array.isArray(events) || !events.length){

    return `
      <div class="details-section">
        <div class="details-section-title">
          ⚡ Match Events
        </div>

        <div class="no-data">
          No event information available.
        </div>
      </div>
    `;
  }

  return `

    <div class="details-section">

      <div class="details-section-title">
        ⚡ Match Events
      </div>

      ${events.map(event => {

        const time =
          event?.time?.elapsed ??
          event?.elapsed ??
          "";

        const type =
          event?.type ||
          "";

        const detail =
          event?.detail ||
          "";

        const player =
          event?.player?.name ||
          event?.player ||
          "";

        const team =
          event?.team?.name ||
          "";

        const text =
          [player,detail]
            .filter(Boolean)
            .join(" — ");

        const homeEvent =
          team === homeName;

        return `

          <div class="event-row">

            <div class="event-home">
              ${homeEvent
                ? escapeHTML(text)
                : ""}
            </div>

            <div class="event-time">
              ${escapeHTML(time)}
              ${time ? "'" : ""}
            </div>

            <div class="event-away">
              ${
                !homeEvent
                ? escapeHTML(text)
                : ""
              }
            </div>

          </div>
        `;

      }).join("")}

    </div>
  `;
}


/* =========================
   STATISTICS
========================= */

function renderStatistics(statistics){

  if(!Array.isArray(statistics) || !statistics.length){

    return `
      <div class="details-section">
        <div class="details-section-title">
          📊 Statistics
        </div>

        <div class="no-data">
          Statistics are not available for this match.
        </div>
      </div>
    `;
  }


  let stats = [];

  if(
    statistics[0]?.statistics &&
    statistics[0]?.team
  ){

    const homeStats =
      statistics[0];

    const awayStats =
      statistics[1] || {};

    const names =
      homeStats.statistics.map(
        x => x.type
      );

    names.forEach(name => {

      const h =
        homeStats.statistics.find(
          x => x.type === name
        );

      const a =
        awayStats.statistics?.find(
          x => x.type === name
        );

      stats.push({
        name,
        home:h?.value ?? "-",
        away:a?.value ?? "-"
      });

    });

  }


  if(!stats.length){

    return `
      <div class="details-section">
        <div class="details-section-title">
          📊 Statistics
        </div>

        <div class="no-data">
          Statistics are not available.
        </div>
      </div>
    `;
  }


  return `

    <div class="details-section">

      <div class="details-section-title">
        📊 Statistics
      </div>

      ${stats.map(stat => {

        const home =
          parseNumber(stat.home);

        const away =
          parseNumber(stat.away);

        const total =
          home + away;

        const percent =
          total > 0
          ? Math.round((home / total) * 100)
          : 50;

        return `

          <div class="stat-row">

            <div class="stat-names">

              <span>
                ${escapeHTML(stat.home)}
              </span>

              <span>
                ${escapeHTML(stat.name)}
              </span>

              <span>
                ${escapeHTML(stat.away)}
              </span>

            </div>

            <div class="stat-bar">

              <div
                class="stat-home"
                style="width:${percent}%"
              ></div>

            </div>

          </div>

        `;

      }).join("")}

    </div>
  `;
}


function parseNumber(value){

  if(typeof value === "number"){
    return value;
  }

  const n =
    parseFloat(
      String(value || "")
        .replace("%","")
    );

  return Number.isFinite(n) ? n : 0;
}

    getTeam(currentMatchData,"away")?.name ||

  const homeScore =

  const awayScore =
    getScore(currentMatchData,"away");

  const text =
    `${home} ${homeScore} - ${awayScore} ${away}\n` +
    `M.Awaji Livescores`;

  if(navigator.share){

    try{

      await navigator.share({
        title:"M.Awaji Livescores",
        text
      });

    }catch{}

  }else{

    try{

      await navigator.clipboard.writeText(text);

      alert("Match information copied.");

    }catch{

      alert(text);
    }
  }
}

    <div class="loading">
      <div class="spinner"></div>
      Loading standings...
    </div>
  `;

  try{

    const data =
      await fetchAPI(
        "standings",
        `&league=${encodeURIComponent(league)}` +
        `&season=${encodeURIComponent(season)}`
      );

    renderStandings(data);

  }catch(error){

    target.innerHTML = `
      <div class="error">
        ${escapeHTML(error.message)}
        <br><br>
        <button onclick="loadStandings()">
          Try Again
        </button>
      </div>
    `;
  }
}


function renderStandings(data){

  const target =
    document.getElementById("standingsContent");

  let groups =
    data?.response?.[0]?.league?.standings ||
    data?.standings ||
    data?.response ||
    [];

  if(
    groups.length &&
    !Array.isArray(groups[0])
  ){
    groups = [groups];
  }

  const rows =
    groups.flat();

  if(!rows.length){

    target.innerHTML = `
      <div class="empty">
        No standings available.
      </div>
    `;

    return;
  }

  target.innerHTML = `

    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>#</th>
            <th style="text-align:left">TEAM</th>
            <th>MP</th>
            <th>W</th>
            <th>D</th>
            <th>L</th>
            <th>GF</th>
            <th>GA</th>
            <th>GD</th>
            <th>PTS</th>
          </tr>

        </thead>

        <tbody>

          ${rows.map((row,index) => {

            const team =
              row?.team || {};

            const all =
              row?.all || {};

            const goals =
              all?.goals || {};

            return `

              <tr>

                <td>
                  ${escapeHTML(
                    row?.rank ?? index+1
                  )}
                </td>

                <td>

                  <div class="team-cell">

                    ${
                      team.logo
                      ? `<img
                          src="${escapeHTML(team.logo)}"
                          alt=""
                          loading="lazy"
                        >`
                      : "⚽"
                    }

                    <span>
                      ${escapeHTML(
                        team.name || "Team"
                      )}
                    </span>

                  </div>

                </td>

                <td>${escapeHTML(all.played ?? "-")}</td>
                <td>${escapeHTML(all.win ?? "-")}</td>
                <td>${escapeHTML(all.draw ?? "-")}</td>
                <td>${escapeHTML(all.lose ?? "-")}</td>
                <td>${escapeHTML(goals.for ?? "-")}</td>
                <td>${escapeHTML(goals.against ?? "-")}</td>
                <td>${escapeHTML(row?.goalsDiff ?? "-")}</td>

                <td>
                  <strong>
                    ${escapeHTML(row?.points ?? "-")}
                  </strong>
                </td>

              </tr>

            `;

          }).join("")}

        </tbody>

      </table>

    </div>
  `;
}


/* =========================
   DARK MODE
========================= */

function toggleDarkMode(){

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem(
    "mawaji_dark_mode",
    dark ? "1" : "0"
  );
}


function loadDarkMode(){

  if(
    localStorage.getItem("mawaji_dark_mode") === "1"
  ){
    document.body.classList.add("dark");
  }
}


/* =========================
   NOTIFICATIONS
========================= */

async function enableNotifications(){

  if(!("Notification" in window)){
    alert("Notifications are not supported by this browser.");
    return;
  }

  if(Notification.permission === "granted"){
    alert("Notifications are already enabled.");
    return;
  }

  try{

    const permission =
      await Notification.requestPermission();

    if(permission === "granted"){

      new Notification(
        "M.Awaji Livescores",
        {
          body:"Football notifications are enabled."
        }
      );

    }

  }catch{}
}

setInterval(() => {

  if(currentPage === "live"){

    loadLive();

  }

},30000);


/* =========================
   START

loadDarkMode();

renderDateBar();

showPage("live");
