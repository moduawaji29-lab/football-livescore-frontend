<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M.awajilivescores</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f5f8;
      color: #172033;
    }

    header {
      background: #071a33;
      color: white;
      padding: 18px 16px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      background: white;
      color: #071a33;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 800;
    }

    .tagline {
      font-size: 10px;
      letter-spacing: 1.8px;
      opacity: .7;
      margin-top: 3px;
    }

    .live-indicator {
      margin-top: 15px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: bold;
    }

    .live-dot {
      width: 9px;
      height: 9px;
      background: #25d366;
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(37,211,102,.15);
    }

    main {
      max-width: 900px;
      margin: auto;
      padding-bottom: 30px;
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      border-bottom: 1px solid #e5e8ed;
    }

    .nav button,
    .date-btn,
    .action-btn {
      border: none;
      cursor: pointer;
      font-weight: 700;
    }

    .nav button {
      padding: 11px 5px;
      border-radius: 8px;
      background: #eef1f5;
      color: #4c5668;
    }

    .nav button.active {
      background: #071a33;
      color: white;
    }

    .date-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 10px;
      background: #f3f5f8;
    }

    .date-btn {
      padding: 10px 5px;
      border-radius: 8px;
      background: white;
      color: #4c5668;
      border: 1px solid #e1e5ea;
    }

    .date-btn.active {
      background: #e9eef5;
      color: #071a33;
      border-color: #071a33;
    }

    .date-label {
      display: block;
      font-size: 12px;
    }

    .date-value {
      display: block;
      font-size: 11px;
      margin-top: 3px;
      opacity: .65;
    }

    .actions {
      padding: 4px 10px 12px;
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 12px;
      border-radius: 9px;
      background: #071a33;
      color: white;
      font-size: 13px;
    }

    .action-btn.secondary {
      background: white;
      color: #071a33;
      border: 1px solid #dce1e7;
    }

    .section-title {
      padding: 5px 10px 10px;
      font-size: 15px;
      font-weight: 800;
    }

    .league {
      background: white;
      margin: 0 10px 12px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e3e7ec;
    }

    .league-header {
      background: #edf1f5;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .league-name {
      font-size: 13px;
      font-weight: 800;
      color: #172033;
    }

    .league-country {
      font-size: 10px;
      color: #7a8494;
      white-space: nowrap;
    }

    .match {
      padding: 13px 12px;
      border-top: 1px solid #edf0f3;
    }

    .match-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    .team {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
    }

    .team.home {
      text-align: right;
    }

    .team.away {
      text-align: left;
    }

    .score-box {
      min-width: 65px;
      text-align: center;
    }

    .score {
      font-size: 18px;
      font-weight: 900;
      color: #071a33;
    }

    .status {
      font-size: 10px;
      margin-top: 3px;
      font-weight: 800;
      color: #7a8494;
    }

    .status.live {
      color: #e53935;
    }

    .match-time {
      font-size: 12px;
      font-weight: 800;
      color: #071a33;
    }

    .loading,
    .empty,
    .error {
      margin: 15px 10px;
      padding: 25px 15px;
      background: white;
      border-radius: 10px;
      text-align: center;
      border: 1px solid #e3e7ec;
    }

    .loading {
      color: #667085;
    }

    .empty {
      color: #667085;
    }

    .error {
      color: #c62828;
      background: #fff7f7;
    }

    .standings-box {
      margin: 10px;
      padding: 30px 15px;
      text-align: center;
      background: white;
      border-radius: 10px;
      border: 1px solid #e3e7ec;
      color: #667085;
    }

    footer {
      text-align: center;
      padding: 25px 10px;
      color: #8a93a1;
      font-size: 11px;
    }

    @media (min-width: 600px) {
      .nav {
        padding: 12px;
      }

      .date-bar {
        padding: 14px 12px;
      }

      .match {
        padding: 15px;
      }

      .team {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="logo">M</div>

      <div>
        <div class="brand-name">M.awajilivescores</div>
        <div class="tagline">LIVE FOOTBALL SCORES</div>
      </div>
    </div>

    <div class="live-indicator">
      <span class="live-dot"></span>
      LIVE FOOTBALL
    </div>

  </div>
</header>


<main>

  <!-- NAVIGATION -->
  <div class="nav">

    <button id="liveBtn" onclick="changePage('live')">
      Live
    </button>

    <button id="fixturesBtn" onclick="changePage('fixtures')">
      Fixtures
    </button>

    <button id="resultsBtn" onclick="changePage('results')">
      Results
    </button>

    <button id="standingsBtn" onclick="changePage('standings')">
      Standings
    </button>

  </div>


  <!-- DATE SELECTOR -->
  <div class="date-bar">

    <button class="date-btn" id="yesterdayBtn"
            onclick="selectDate(-1)">
      <span class="date-label">Yesterday</span>
      <span class="date-value" id="yesterdayDate"></span>
    </button>

    <button class="date-btn active" id="todayBtn"
            onclick="selectDate(0)">
      <span class="date-label">Today</span>
      <span class="date-value" id="todayDate"></span>
    </button>

    <button class="date-btn" id="tomorrowBtn"
            onclick="selectDate(1)">
      <span class="date-label">Tomorrow</span>
      <span class="date-value" id="tomorrowDate"></span>
    </button>

  </div>


  <!-- ACTION BUTTONS -->
  <div class="actions">

    <button class="action-btn"
            onclick="showAllMatches()">
      ⚽ Show All Matches
    </button>

    <button class="action-btn secondary"
            onclick="reloadCurrentPage()">
      ↻ Refresh
    </button>

  </div>


  <div id="content"></div>


  <footer>
    M.awajilivescores<br>
    Live football scores and fixtures
  </footer>

</main>


<script>

  /*
   * YOUR WORKING VERCEL BACKEND
   * DO NOT PUT YOUR API KEY HERE.
   */
  const API_BASE =
    "https://football-livescore-backend-new.vercel.app/api";


  let currentPage = "live";

  let selectedDate =
    new Date();


  /*
   * FORMAT DATE
   */
  function formatDate(date) {

    const year =
      date.getFullYear();

    const month =
      String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(date.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;
  }


  /*
   * DISPLAY DATE
   */
  function prettyDate(date) {

    return date.toLocaleDateString(
      undefined,
      {
        day: "numeric",
        month: "short"
      }
    );
  }


  /*
   * SETUP DATES
   */
  function setupDates() {

    const today =
      new Date();

    const yesterday =
      new Date(today);

    yesterday.setDate(
      today.getDate() - 1
    );

    const tomorrow =
      new Date(today);

    tomorrow.setDate(
      today.getDate() + 1
    );


    document.getElementById(
      "yesterdayDate"
    ).textContent =
      prettyDate(yesterday);


    document.getElementById(
      "todayDate"
    ).textContent =
      prettyDate(today);


    document.getElementById(
      "tomorrowDate"
    ).textContent =
      prettyDate(tomorrow);
  }


  /*
   * API REQUEST
   */
  async function fetchAPI(
    action,
    extra = ""
  ) {

    const url =
      `${API_BASE}?action=${action}${extra}`;


    const response =
      await fetch(url);


    if (!response.ok) {

      throw new Error(
        `Server returned ${response.status}`
      );

    }


    const data =
      await response.json();


    return data;
  }


  /*
   * LOADING
   */
  function showLoading() {

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="loading">
        Loading football matches...
      </div>
    `;
  }


  /*
   * EMPTY
   */
  function showEmpty(message) {

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="empty">
        ${escapeHTML(message)}
      </div>
    `;
  }


  /*
   * ERROR
   */
  function showConnectionError(error) {

    console.error(error);

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="error">
        Unable to load football data.<br><br>
        Please check your internet connection
        and try again.
      </div>
    `;
  }


  /*
   * API ERROR
   */
  function hasAPIError(data) {

    return data &&
      data.errors &&
      Object.keys(data.errors).length > 0;
  }


  function showAPIError(data) {

    console.error(data);

    let message =
      "The football API returned an error.";

    if (data.errors) {

      const values =
        Object.values(data.errors);

      if (values.length) {
        message =
          values.join(" ");
      }

    }


    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="error">
        ${escapeHTML(message)}
      </div>
    `;
  }


  /*
   * LIVE
   */
  async function loadLive() {

    showLoading();

    try {

      const data =
        await fetchAPI("live");


      if (hasAPIError(data)) {

        showAPIError(data);
        return;

      }


      const matches =
        data.response || [];


      if (!matches.length) {

        showEmpty(
          "There are currently no live matches."
        );

        return;
      }


      displayMatches(
        matches,
        "Live Matches"
      );

    } catch (error) {

      showConnectionError(error);

    }
  }


  /*
   * FIXTURES
   */
  async function loadFixtures() {

    showLoading();

    try {

      const date =
        formatDate(selectedDate);


      const data =
        await fetchAPI(
          "fixtures",
          `&date=${date}`
        );


      if (hasAPIError(data)) {

        showAPIError(data);
        return;

      }


      const matches =
        data.response || [];


      if (!matches.length) {

        showEmpty(
          `No fixtures found for ${prettyDate(selectedDate)}.`
        );

        return;
      }


      displayMatches(
        matches,
        "Fixtures"
      );

    } catch (error) {

      showConnectionError(error);

    }
  }


  /*
   * RESULTS
   */
  async function loadResults() {

    showLoading();

    try {

      const date =
        formatDate(selectedDate);


      const data =
        await fetchAPI(
          "results",
          `&date=${date}`
        );


      if (hasAPIError(data)) {

        showAPIError(data);
        return;

      }


      const matches =
        data.response || [];


      if (!matches.length) {

        showEmpty(
          `No results found for ${prettyDate(selectedDate)}.`
        );

        return;
      }


      displayMatches(
        matches,
        "Results"
      );

    } catch (error) {

      showConnectionError(error);

    }
  }


  /*
   * SHOW ALL MATCHES
   *
   * This loads every fixture returned
   * by API-Football for the selected date.
   */
  async function showAllMatches() {

    currentPage = "fixtures";

    setActiveButton("fixtures");

    showLoading();


    try {

      const date =
        formatDate(selectedDate);


      const data =
        await fetchAPI(
          "fixtures",
          `&date=${date}`
        );


      if (hasAPIError(data)) {

        showAPIError(data);
        return;

      }


      const matches =
        data.response || [];


      if (!matches.length) {

        showEmpty(
          `No matches found for ${prettyDate(selectedDate)}.`
        );

        return;
      }


      displayMatches(
        matches,
        `All Matches — ${prettyDate(selectedDate)}`
      );


    } catch (error) {

      showConnectionError(error);

    }

  }


  /*
   * CHANGE PAGE
   */
  function changePage(page) {

    currentPage = page;

    setActiveButton(page);


    if (page === "live") {

      loadLive();

    }

    else if (page === "fixtures") {

      loadFixtures();

    }

    else if (page === "results") {

      loadResults();

    }

    else if (page === "standings") {

      showStandingsMessage();

    }

  }


  /*
   * ACTIVE NAV BUTTON
   */
  function setActiveButton(page) {

    document
      .querySelectorAll(".nav button")
      .forEach(button => {

        button.classList.remove("active");

      });


    const button =
      document.getElementById(
        page + "Btn"
      );


    if (button) {

      button.classList.add("active");

    }

  }


  /*
   * SELECT DATE
   */
  function selectDate(offset) {

    const today =
      new Date();


    selectedDate =
      new Date(today);


    selectedDate.setDate(
      today.getDate() + offset
    );


    document
      .querySelectorAll(".date-btn")
      .forEach(button => {

        button.classList.remove("active");

      });


    if (offset === -1) {

      document
        .getElementById("yesterdayBtn")
        .classList.add("active");

    }

    else if (offset === 0) {

      document
        .getElementById("todayBtn")
        .classList.add("active");

    }

    else {

      document
        .getElementById("tomorrowBtn")
        .classList.add("active");

    }


    reloadCurrentPage();

  }


  /*
   * RELOAD CURRENT PAGE
   */
  function reloadCurrentPage() {

    if (currentPage === "live") {

      loadLive();

    }

    else if (currentPage === "fixtures") {

      loadFixtures();

    }

    else if (currentPage === "results") {

      loadResults();

    }

    else if (currentPage === "standings") {

      showStandingsMessage();

    }

  }


  /*
   * STANDINGS
   */
  function showStandingsMessage() {

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="standings-box">
        <strong>Standings</strong>
        <br><br>
        League standings will appear here.
      </div>
    `;

  }


  /*
   * DISPLAY MATCHES
   */
  function displayMatches(
    matches,
    title
  ) {

    const content =
      document.getElementById(
        "content"
      );


    content.innerHTML = `
      <div class="section-title">
        ${escapeHTML(title)}
      </div>
    `;


    /*
     * GROUP MATCHES BY LEAGUE
     */
    const leagues = {};


    matches.forEach(match => {

      const league =
        match.league || {};


      const leagueId =
        league.id ||
        league.name ||
        "unknown";


      if (!leagues[leagueId]) {

        leagues[leagueId] = {

          name:
            league.name ||
            "Unknown League",

          country:
            league.country ||
            "",

          matches: []

        };

      }


      leagues[leagueId]
        .matches
        .push(match);

    });


    /*
     * CREATE LEAGUE SECTIONS
     */
    Object.values(leagues)
      .forEach(league => {


        const leagueDiv =
          document.createElement(
            "div"
          );


        leagueDiv.className =
          "league";


        leagueDiv.innerHTML = `

          <div class="league-header">

            <div class="league-name">
              ${escapeHTML(league.name)}
            </div>

            <div class="league-country">
              ${escapeHTML(league.country)}
            </div>

          </div>

        `;


        league.matches
          .forEach(match => {

            leagueDiv.appendChild(
              createMatchElement(match)
            );

          });


        content.appendChild(
          leagueDiv
        );

      });


  }


  /*
   * CREATE MATCH CARD
   */
  function createMatchElement(match) {

    const fixture =
      match.fixture || {};


    const teams =
      match.teams || {};


    const goals =
      match.goals || {};


    const status =
      fixture.status || {};


    const home =
      teams.home?.name ||
      "Home";


    const away =
      teams.away?.name ||
      "Away";


    const homeScore =
      goals.home ??
      "-";


    const awayScore =
      goals.away ??
      "-";


    const shortStatus =
      status.short ||
      "";


    const elapsed =
      status.elapsed;


    const live =
      isLiveStatus(shortStatus);


    let statusText =
      shortStatus;


    if (live && elapsed) {

      statusText =
        `${elapsed}' LIVE`;

    }


    if (
      shortStatus === "NS" ||
      shortStatus === "TBD"
    ) {

      const dateTime =
        fixture.date
          ? new Date(fixture.date)
          : null;


      if (dateTime) {

        statusText =
          dateTime.toLocaleTimeString(
            [],
            {
              hour: "2-digit",
              minute: "2-digit"
            }
          );

      }

    }


    const matchDiv =
      document.createElement(
        "div"
      );


    matchDiv.className =
      "match";


    matchDiv.innerHTML = `

      <div class="match-main">

        <div class="team home">
          ${escapeHTML(home)}
        </div>


        <div class="score-box">

          <div class="score">
            ${escapeHTML(String(homeScore))}
            -
            ${escapeHTML(String(awayScore))}
          </div>

          <div class="status ${live ? "live" : ""}">
            ${escapeHTML(statusText)}
          </div>

        </div>


        <div class="team away">
          ${escapeHTML(away)}
        </div>

      </div>

    `;


    return matchDiv;

  }


  /*
   * LIVE STATUS
   */
  function isLiveStatus(status) {

    const liveStatuses = [

      "1H",
      "2H",
      "HT",
      "ET",
      "P",
      "BT",
      "LIVE"

    ];


    return liveStatuses.includes(
      status
    );

  }


  /*
   * HTML SECURITY
   */
  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /*
   * START APP
   */
  setupDates();

  setActiveButton("live");

  loadLive();

</script>

</body>
</html>
